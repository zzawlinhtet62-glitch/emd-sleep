<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMD — 互動式睡眠訊號分解</title>
<meta name="description" content="An interactive page on Empirical Mode Decomposition and the Hilbert spectrum, and what they mean for sleep research. Every curve is computed in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101820'/><path d='M2 16 q4 -9 8 0 t8 0 t8 0 t8 0' fill='none' stroke='%23E8D5A8' stroke-width='2'/></svg>">
<style>
/*__CSS__*/
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span data-i18n="brand">經驗模態分解</span><span data-i18n="brandSub">整夜記錄</span></div>
    <button class="ghost" id="langBtn" type="button">EN</button>
    <button class="ghost" id="themeBtn" type="button">明亮</button>
  </div>
</header>

<main>

  <div class="wrap hero">
    <h1 data-i18n="heroTitle">把一夜的腦波，拆成它自己的節奏</h1>
    <p class="lede" data-i18n="heroLede"></p>
    <div class="hero-strip">
      <canvas id="heroCanvas" aria-hidden="true"></canvas>
      <div class="strip-cap">
        <span data-i18n="stripLeft"></span>
        <span data-i18n="stripRight"></span>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="introEyebrow">起點</p>
      <h2 data-i18n="introTitle"></h2>
      <p data-i18n="introP1"></p>
      <p data-i18n="introP2"></p>
      <p data-i18n="introP3"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="1" aria-selected="true">一、篩選演算法</button>
        <button class="tab" role="tab" type="button" data-tab="2" aria-selected="false">二、五個睡眠期</button>
        <button class="tab" role="tab" type="button" data-tab="3" aria-selected="false">三、傅立葉 vs 希爾伯特</button>
      </div>

      <!-- ===== tab 1 ===== -->
      <div class="panel" role="tabpanel" data-tab="1">
        <h2 data-i18n="p1Title"></h2>
        <p data-i18n="p1Intro"></p>

        <div class="controls">
          <button class="btn primary" id="t1Next" type="button">下一步</button>
          <button class="btn" id="t1Reset" type="button" data-i18n="p1Reset">重新開始</button>
        </div>

        <p class="stepline"><b id="t1Round"></b> · <span id="t1StepNo"></span> — <span id="t1StepText"></span></p>

        <div class="plot">
          <div class="plot-head"><span data-i18n="p1SigTitle"></span><span class="mono">fs = 64 Hz · N = 256 · t (s)</span></div>
          <canvas id="t1Main" aria-hidden="true"></canvas>
          <div class="legend" id="t1Legend"></div>
        </div>

        <div class="plot" id="t1HWrap">
          <div class="plot-head"><span data-i18n="p1HTitle"></span><span class="mono" id="t1HNote"></span></div>
          <canvas id="t1H" aria-hidden="true"></canvas>
        </div>

        <div class="checks" id="t1Checks" hidden></div>

        <h3 data-i18n="tableTitle"></h3>
        <p data-i18n="tableIntro"></p>
        <div class="controls">
          <div class="slider">
            <label for="t1Pos" data-i18n="tablePos">讀取位置</label>
            <input type="range" id="t1Pos" min="0" max="255" step="1" value="120">
            <output id="t1PosOut" for="t1Pos"></output>
          </div>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr>
              <th data-i18n="thIdx">i</th><th data-i18n="thT">t (s)</th><th data-i18n="thSig">訊號</th>
              <th data-i18n="thUp">上包絡</th><th data-i18n="thLo">下包絡</th>
              <th data-i18n="thMean">中線</th><th data-i18n="thH">h</th>
            </tr></thead>
            <tbody id="t1Body"></tbody>
          </table>
        </div>
      </div>

      <!-- ===== tab 2 ===== -->
      <div class="panel" role="tabpanel" data-tab="2" hidden>
        <h2 data-i18n="p2Title"></h2>
        <p data-i18n="p2Intro"></p>

        <div class="controls">
          <div class="stages" id="t2Stages">
            <button class="btn" type="button" data-stage="wake">清醒</button>
            <button class="btn" type="button" data-stage="n1">N1</button>
            <button class="btn" type="button" data-stage="n2">N2</button>
            <button class="btn" type="button" data-stage="n3">N3</button>
            <button class="btn" type="button" data-stage="rem">REM</button>
          </div>
        </div>
        <div class="controls">
          <div class="slider">
            <label for="t2Noise" data-i18n="p2Noise">加入雜訊</label>
            <input type="range" id="t2Noise" min="0" max="30" step="1" value="0">
            <output id="t2NoiseOut" for="t2Noise"></output>
          </div>
        </div>

        <p class="stage-desc" id="t2StageDesc"></p>

        <div class="plot">
          <div class="plot-head"><span class="mono">fs = 100 Hz · N = 1024</span><span class="mono" id="t2Axis"></span></div>
          <div class="imf-rows" id="t2Rows"></div>
        </div>

        <p class="note" id="t2NoiseNote"></p>
      </div>

      <!-- ===== tab 3 ===== -->
      <div class="panel" role="tabpanel" data-tab="3" hidden>
        <h2 data-i18n="p3Title"></h2>
        <p data-i18n="p3Intro"></p>

        <div class="controls">
          <div class="slider">
            <label for="t3Time" data-i18n="p3Time">紡錘波出現時間</label>
            <input type="range" id="t3Time" min="1" max="9.2" step="0.05" value="4">
            <output id="t3TimeOut" for="t3Time"></output>
          </div>
          <div class="slider">
            <label for="t3Freq" data-i18n="p3Freq">紡錘波頻率</label>
            <input type="range" id="t3Freq" min="9" max="18" step="0.1" value="13">
            <output id="t3FreqOut" for="t3Freq"></output>
          </div>
        </div>

        <div class="plot">
          <div class="plot-head"><span data-i18n="p3SigTitle"></span><span class="mono">fs = 100 Hz · N = 1024 · t (s)</span></div>
          <canvas id="t3Sig" aria-hidden="true"></canvas>
        </div>

        <div class="grid2" style="margin-top:14px">
          <div class="plot">
            <div class="plot-head"><span data-i18n="p3FourierTitle"></span></div>
            <canvas id="t3Fourier" aria-hidden="true"></canvas>
            <div class="legend"><span data-i18n="p3FourierSub"></span></div>
          </div>
          <div class="plot">
            <div class="plot-head"><span data-i18n="p3HilbertTitle"></span></div>
            <canvas id="t3Hilbert" aria-hidden="true"></canvas>
            <div class="legend"><span data-i18n="p3HilbertSub"></span></div>
          </div>
        </div>

        <div class="readout">
          <div id="t3r1"></div>
          <div id="t3r2"></div>
          <div id="t3r3"></div>
        </div>

        <p class="note" data-i18n="p3Concl"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="whyEyebrow">應用</p>
      <h2 data-i18n="whyTitle"></h2>
      <div class="cols" style="margin-top:24px">
        <div><h3 data-i18n="why1Title"></h3><p data-i18n="why1"></p></div>
        <div><h3 data-i18n="why2Title"></h3><p data-i18n="why2"></p></div>
        <div><h3 data-i18n="why3Title"></h3><p data-i18n="why3"></p></div>
        <div><h3 data-i18n="why4Title"></h3><p data-i18n="why4"></p></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="limEyebrow">限制</p>
      <h2 data-i18n="limTitle"></h2>
      <p data-i18n="limIntro"></p>
      <h3 data-i18n="lim1Title"></h3><p data-i18n="lim1"></p>
      <h3 data-i18n="lim2Title"></h3><p data-i18n="lim2"></p>
      <h3 data-i18n="lim3Title"></h3><p data-i18n="lim3"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="implEyebrow">實作</p>
      <h2 data-i18n="implTitle"></h2>
      <p data-i18n="implIntro"></p>
      <ul id="implList"></ul>
      <p class="note" data-i18n="implTests"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="refEyebrow">文獻</p>
      <h2 data-i18n="refTitle"></h2>
      <div id="refList"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <p data-i18n="footer1"></p>
    <p data-i18n="footer2"></p>
  </div>
</footer>

<script>
/*__EMD__*/
</script>
<script>
/*__SIGNALS__*/
</script>
<script>
/*__I18N__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
