<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMD — 互動式睡眠訊號分解</title>
<meta name="description" content="An interactive page on Empirical Mode Decomposition and the Hilbert spectrum, and what they mean for sleep research. Every curve is computed in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101820'/><path d='M2 16 q4 -9 8 0 t8 0 t8 0 t8 0' fill='none' stroke='%23E8D5A8' stroke-width='2'/></svg>">
<style>
/* ===== Overnight Recording — visual system =====================
   Cool background, warm signal trace: the curve should read like
   a lit pen on dark paper, the way a sleep lab looks at 3 a.m.  */

:root {
  --night:    #101820;
  --panel:    #18222C;
  --haze:     #243140;
  --text:     #DCE4EA;
  --text-dim: #8C9AA8;
  --trace:    #E8D5A8;
  --coral:    #E0705E;
  --cyan:     #5AB6C4;
  --sage:     #8FBF7F;
  --violet:   #9B8CC4;
  --shadow:   rgba(0,0,0,.35);

  --serif: "Fraunces", "Newsreader", Georgia, "Noto Serif TC", serif;
  --sans:  "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:  "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --measure: 68ch;
  --wrap: 1100px;
  --radius: 3px;
}

:root[data-theme="light"] {
  --night:    #EDF0F3;
  --panel:    #FBFCFD;
  --haze:     #CBD5DE;
  --text:     #16202A;
  --text-dim: #5C6B79;
  --trace:    #8A6520;
  --coral:    #BE4432;
  --cyan:     #1C6B78;
  --sage:     #3F7A31;
  --violet:   #5D4E93;
  --shadow:   rgba(16,24,32,.10);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --night:    #EDF0F3;
    --panel:    #FBFCFD;
    --haze:     #CBD5DE;
    --text:     #16202A;
    --text-dim: #5C6B79;
    --trace:    #8A6520;
    --coral:    #BE4432;
    --cyan:     #1C6B78;
    --sage:     #3F7A31;
    --violet:   #5D4E93;
    --shadow:   rgba(16,24,32,.10);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

p, li { max-width: var(--measure); }

a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent); }
a:hover { border-bottom-color: var(--cyan); }

h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
h2 { font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2rem); margin: 0 0 .6rem; }
h3 { font-size: 1.15rem; margin: 2rem 0 .5rem; }

.num, td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--night) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--haze);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { font-family: var(--serif); font-size: 1rem; letter-spacing: .02em; margin-right: auto; }
.brand span { color: var(--text-dim); font-family: var(--sans); font-size: .8rem; margin-left: .6rem; }

.ghost {
  appearance: none; background: none; cursor: pointer;
  border: 1px solid var(--haze); border-radius: var(--radius);
  color: var(--text-dim); font: 500 .8rem/1 var(--sans);
  padding: 7px 11px; letter-spacing: .03em;
}
.ghost:hover { color: var(--text); border-color: var(--text-dim); }
.ghost:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- hero ---------- */
.hero { padding: 64px 0 40px; border-bottom: 1px solid var(--haze); }
.hero h1 { font-size: clamp(2rem, 1.3rem + 3vw, 3.2rem); margin: 0 0 1rem; max-width: 20ch; }
.hero .lede { color: var(--text-dim); font-size: 1.05rem; max-width: 60ch; }
.hero-strip { margin-top: 36px; }
.hero-strip canvas { width: 100%; height: 300px; display: block; }
.strip-cap {
  display: flex; justify-content: space-between; gap: 16px;
  color: var(--text-dim); font: 400 .78rem/1.5 var(--mono);
  border-top: 1px solid var(--haze); padding-top: 8px; margin-top: 6px;
}

/* ---------- sections ---------- */
section { padding: 56px 0; border-bottom: 1px solid var(--haze); }
.eyebrow {
  font: 500 .72rem/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-dim); margin: 0 0 .9rem;
}

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--haze); margin: 8px 0 28px; flex-wrap: wrap; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  color: var(--text-dim); font: 500 .95rem/1 var(--sans);
  padding: 0 0 12px; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--trace); }
.tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.panel[hidden] { display: none; }

/* ---------- controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.btn {
  appearance: none; cursor: pointer; border-radius: var(--radius);
  border: 1px solid var(--haze); background: var(--panel); color: var(--text);
  font: 500 .88rem/1 var(--sans); padding: 10px 16px;
}
.btn:hover { border-color: var(--text-dim); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: var(--trace); border-color: var(--trace); color: #1A130B; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--trace); color: var(--trace); }

.slider { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 230px; }
.slider label { color: var(--text-dim); font-size: .85rem; white-space: nowrap; }
.slider output { font-family: var(--mono); font-size: .85rem; min-width: 7ch; text-align: right; }
input[type="range"] {
  appearance: none; flex: 1; height: 2px; background: var(--haze); border-radius: 2px; margin: 0;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--trace); border: 0; cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%; background: var(--trace); border: 0; cursor: pointer;
}
input[type="range"]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }

/* ---------- plots ---------- */
.plot { background: var(--panel); border: 1px solid var(--haze); border-radius: var(--radius); padding: 10px 12px 6px; }
.plot + .plot { margin-top: 14px; }
.plot canvas { width: 100%; display: block; }
.plot-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font: 500 .78rem/1.4 var(--mono); color: var(--text-dim); margin-bottom: 6px;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0; font: 400 .76rem/1.6 var(--mono); color: var(--text-dim); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 7px; }
.legend .dot { width: 7px; height: 7px; border-radius: 50%; }

.stepline { font: 400 .8rem/1.5 var(--mono); color: var(--text-dim); margin: 0 0 14px; }
.stepline b { color: var(--text); font-weight: 600; }

/* ---------- condition report ---------- */
.checks { display: grid; gap: 10px; margin-top: 16px; }
.check {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline;
  border: 1px solid var(--haze); border-left-width: 3px; border-radius: var(--radius);
  background: var(--panel); padding: 12px 14px; font-size: .88rem;
}
.check .tag { font: 600 .74rem/1 var(--mono); letter-spacing: .08em; color: var(--text-dim); }
.check .val { font-family: var(--mono); font-size: .84rem; color: var(--text-dim); white-space: nowrap; }
.check.ok   { border-left-color: var(--sage); }
.check.no   { border-left-color: var(--coral); }
.check.ok .val { color: var(--sage); }
.check.no .val { color: var(--coral); }
.verdict { margin-top: 14px; font-family: var(--mono); font-size: .86rem; }
.verdict.ok { color: var(--sage); }
.verdict.no { color: var(--coral); }

/* ---------- table ---------- */
.tablewrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--haze); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: .8rem; }
th, td { padding: 7px 12px; text-align: right; white-space: nowrap; }
th {
  background: var(--panel); color: var(--text-dim); font-weight: 500;
  border-bottom: 1px solid var(--haze); position: sticky; top: 0;
  font-size: .74rem; letter-spacing: .04em;
}
td { border-bottom: 1px solid color-mix(in srgb, var(--haze) 45%, transparent); color: var(--text-dim); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.focus td { background: color-mix(in srgb, var(--trace) 9%, transparent); color: var(--text); }
th:first-child, td:first-child { text-align: left; }
.c-trace { color: var(--trace) !important; }
.c-cyan  { color: var(--cyan) !important; }
.c-sage  { color: var(--sage) !important; }

/* ---------- stage buttons / imf list ---------- */
.stages { display: flex; flex-wrap: wrap; gap: 8px; }
.imf-rows { margin-top: 14px; display: grid; gap: 0; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

.readout {
  margin-top: 16px; border: 1px solid var(--haze); border-radius: var(--radius);
  background: var(--panel); padding: 14px 16px;
  font-family: var(--mono); font-size: .84rem; color: var(--text-dim);
  display: grid; gap: 6px;
}
.readout b { color: var(--text); font-weight: 600; }
.readout .hi { color: var(--trace); }

.note {
  border-left: 2px solid var(--haze); padding: 2px 0 2px 16px;
  color: var(--text-dim); font-size: .92rem; margin: 20px 0 0; max-width: var(--measure);
}

/* ---------- references ---------- */
.refs { display: grid; gap: 22px; margin-top: 8px; }
.ref { display: grid; grid-template-columns: 3.2rem 1fr; gap: 16px; max-width: 76ch; }
.ref .n { font: 500 .8rem/1.8 var(--mono); color: var(--trace); }
.ref p { margin: 0; font-size: .92rem; }
.ref .meta { color: var(--text-dim); font-size: .84rem; margin-top: 2px; }
.ref .gloss { color: var(--text-dim); font-size: .86rem; margin-top: .5rem; border-left: 2px solid var(--haze); padding-left: 14px; }
.ref-group { font: 500 .72rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin: 34px 0 6px; }

footer { padding: 40px 0 64px; color: var(--text-dim); font-size: .85rem; }
footer p { max-width: var(--measure); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.cols h3 { margin-top: 0; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .hero { padding: 40px 0 28px; }
  .hero-strip canvas { height: 220px; }
  section { padding: 40px 0; }
  .tabs { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- stacked IMF rows (tab 2 and the hero strip) ---------- */
.imf-row {
  display: grid; grid-template-columns: 172px 1fr; gap: 14px; align-items: center;
  border-top: 1px solid color-mix(in srgb, var(--haze) 60%, transparent);
  padding: 2px 0;
}
.imf-row:first-child { border-top: 0; }
.imf-row canvas { width: 100%; display: block; }
.imf-meta { font: 400 .76rem/1.45 var(--mono); color: var(--text-dim); padding: 6px 0; }
.imf-meta b { display: block; color: var(--text); font-weight: 600; letter-spacing: .02em; }
.imf-meta .band { color: var(--cyan); }
.imf-row.is-signal .imf-meta b { color: var(--trace); }
@media (max-width: 560px) {
  .imf-row { grid-template-columns: 1fr; gap: 0; }
  .imf-meta { padding: 6px 0 0; }
}

.stage-desc { color: var(--text-dim); font-size: .92rem; margin: 14px 0 4px; max-width: var(--measure); }
.axis-note { font: 400 .72rem/1.4 var(--mono); color: var(--text-dim); text-align: right; margin-top: 6px; }

.plot.is-waiting canvas { opacity: .2; }
.plot.is-waiting .plot-head { opacity: .6; }
#implList { padding-left: 0; list-style: none; }
#implList li { margin-bottom: .5rem; max-width: var(--measure); font-size: .92rem; color: var(--text-dim); }
#implList code { color: var(--trace); font-size: .86rem; }
.hero-strip .plot-head { margin-bottom: 8px; }

</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span data-i18n="brand">經驗模態分解</span><span data-i18n="brandSub">整夜記錄</span></div>
    <button class="ghost" id="langBtn" type="button">EN</button>
    <button class="ghost" id="themeBtn" type="button">明亮</button>
  </div>
</header>

<main>

  <div class="wrap hero">
    <h1 data-i18n="heroTitle">把一夜的腦波，拆成它自己的節奏</h1>
    <p class="lede" data-i18n="heroLede"></p>
    <div class="hero-strip">
      <canvas id="heroCanvas" aria-hidden="true"></canvas>
      <div class="strip-cap">
        <span data-i18n="stripLeft"></span>
        <span data-i18n="stripRight"></span>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="introEyebrow">起點</p>
      <h2 data-i18n="introTitle"></h2>
      <p data-i18n="introP1"></p>
      <p data-i18n="introP2"></p>
      <p data-i18n="introP3"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="1" aria-selected="true">一、篩選演算法</button>
        <button class="tab" role="tab" type="button" data-tab="2" aria-selected="false">二、五個睡眠期</button>
        <button class="tab" role="tab" type="button" data-tab="3" aria-selected="false">三、傅立葉 vs 希爾伯特</button>
      </div>

      <!-- ===== tab 1 ===== -->
      <div class="panel" role="tabpanel" data-tab="1">
        <h2 data-i18n="p1Title"></h2>
        <p data-i18n="p1Intro"></p>

        <div class="controls">
          <button class="btn primary" id="t1Next" type="button">下一步</button>
          <button class="btn" id="t1Reset" type="button" data-i18n="p1Reset">重新開始</button>
        </div>

        <p class="stepline"><b id="t1Round"></b> · <span id="t1StepNo"></span> — <span id="t1StepText"></span></p>

        <div class="plot">
          <div class="plot-head"><span data-i18n="p1SigTitle"></span><span class="mono">fs = 64 Hz · N = 256 · t (s)</span></div>
          <canvas id="t1Main" aria-hidden="true"></canvas>
          <div class="legend" id="t1Legend"></div>
        </div>

        <div class="plot" id="t1HWrap">
          <div class="plot-head"><span data-i18n="p1HTitle"></span><span class="mono" id="t1HNote"></span></div>
          <canvas id="t1H" aria-hidden="true"></canvas>
        </div>

        <div class="checks" id="t1Checks" hidden></div>

        <h3 data-i18n="tableTitle"></h3>
        <p data-i18n="tableIntro"></p>
        <div class="controls">
          <div class="slider">
            <label for="t1Pos" data-i18n="tablePos">讀取位置</label>
            <input type="range" id="t1Pos" min="0" max="255" step="1" value="120">
            <output id="t1PosOut" for="t1Pos"></output>
          </div>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr>
              <th data-i18n="thIdx">i</th><th data-i18n="thT">t (s)</th><th data-i18n="thSig">訊號</th>
              <th data-i18n="thUp">上包絡</th><th data-i18n="thLo">下包絡</th>
              <th data-i18n="thMean">中線</th><th data-i18n="thH">h</th>
            </tr></thead>
            <tbody id="t1Body"></tbody>
          </table>
        </div>
      </div>

      <!-- ===== tab 2 ===== -->
      <div class="panel" role="tabpanel" data-tab="2" hidden>
        <h2 data-i18n="p2Title"></h2>
        <p data-i18n="p2Intro"></p>

        <div class="controls">
          <div class="stages" id="t2Stages">
            <button class="btn" type="button" data-stage="wake">清醒</button>
            <button class="btn" type="button" data-stage="n1">N1</button>
            <button class="btn" type="button" data-stage="n2">N2</button>
            <button class="btn" type="button" data-stage="n3">N3</button>
            <button class="btn" type="button" data-stage="rem">REM</button>
          </div>
        </div>
        <div class="controls">
          <div class="slider">
            <label for="t2Noise" data-i18n="p2Noise">加入雜訊</label>
            <input type="range" id="t2Noise" min="0" max="30" step="1" value="0">
            <output id="t2NoiseOut" for="t2Noise"></output>
          </div>
        </div>

        <p class="stage-desc" id="t2StageDesc"></p>

        <div class="plot">
          <div class="plot-head"><span class="mono">fs = 100 Hz · N = 1024</span><span class="mono" id="t2Axis"></span></div>
          <div class="imf-rows" id="t2Rows"></div>
        </div>

        <p class="note" id="t2NoiseNote"></p>
      </div>

      <!-- ===== tab 3 ===== -->
      <div class="panel" role="tabpanel" data-tab="3" hidden>
        <h2 data-i18n="p3Title"></h2>
        <p data-i18n="p3Intro"></p>

        <div class="controls">
          <div class="slider">
            <label for="t3Time" data-i18n="p3Time">紡錘波出現時間</label>
            <input type="range" id="t3Time" min="1" max="9.2" step="0.05" value="4">
            <output id="t3TimeOut" for="t3Time"></output>
          </div>
          <div class="slider">
            <label for="t3Freq" data-i18n="p3Freq">紡錘波頻率</label>
            <input type="range" id="t3Freq" min="9" max="18" step="0.1" value="13">
            <output id="t3FreqOut" for="t3Freq"></output>
          </div>
        </div>

        <div class="plot">
          <div class="plot-head"><span data-i18n="p3SigTitle"></span><span class="mono">fs = 100 Hz · N = 1024 · t (s)</span></div>
          <canvas id="t3Sig" aria-hidden="true"></canvas>
        </div>

        <div class="grid2" style="margin-top:14px">
          <div class="plot">
            <div class="plot-head"><span data-i18n="p3FourierTitle"></span></div>
            <canvas id="t3Fourier" aria-hidden="true"></canvas>
            <div class="legend"><span data-i18n="p3FourierSub"></span></div>
          </div>
          <div class="plot">
            <div class="plot-head"><span data-i18n="p3HilbertTitle"></span></div>
            <canvas id="t3Hilbert" aria-hidden="true"></canvas>
            <div class="legend"><span data-i18n="p3HilbertSub"></span></div>
          </div>
        </div>

        <div class="readout">
          <div id="t3r1"></div>
          <div id="t3r2"></div>
          <div id="t3r3"></div>
        </div>

        <p class="note" data-i18n="p3Concl"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="whyEyebrow">應用</p>
      <h2 data-i18n="whyTitle"></h2>
      <div class="cols" style="margin-top:24px">
        <div><h3 data-i18n="why1Title"></h3><p data-i18n="why1"></p></div>
        <div><h3 data-i18n="why2Title"></h3><p data-i18n="why2"></p></div>
        <div><h3 data-i18n="why3Title"></h3><p data-i18n="why3"></p></div>
        <div><h3 data-i18n="why4Title"></h3><p data-i18n="why4"></p></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="limEyebrow">限制</p>
      <h2 data-i18n="limTitle"></h2>

<script>
/* ============================================================
   emd.core.js — Empirical Mode Decomposition / Hilbert-Huang
   Pure vanilla JavaScript. No dependencies.
   Huang et al. (1998), Proc. R. Soc. Lond. A 454, 903-995.
   ============================================================ */
'use strict';
(function (global) {

  /* ---------- 1. natural cubic spline ------------------------
     Solves the tridiagonal system for the second derivatives
     (natural boundary: m[0] = m[n-1] = 0) with the Thomas
     algorithm, then evaluates the piecewise cubic at xq.
     xs must be strictly increasing; xq is assumed ascending
     (a moving interval pointer keeps evaluation O(n+m)).      */
  function cubicSpline(xs, ys, xq) {
    const n = xs.length;
    const out = new Float64Array(xq.length);
    if (n === 0) return out;
    if (n === 1) { out.fill(ys[0]); return out; }
    if (n === 2) {
      const k = (ys[1] - ys[0]) / (xs[1] - xs[0]);
      for (let i = 0; i < xq.length; i++) out[i] = ys[0] + k * (xq[i] - xs[0]);
      return out;
    }

    const h = new Float64Array(n - 1);
    for (let i = 0; i < n - 1; i++) h[i] = xs[i + 1] - xs[i];

    const sub = new Float64Array(n), diag = new Float64Array(n),
          sup = new Float64Array(n), rhs = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) {
      sub[i]  = h[i - 1];
      diag[i] = 2 * (h[i - 1] + h[i]);
      sup[i]  = h[i];
      rhs[i]  = 6 * ((ys[i + 1] - ys[i]) / h[i] - (ys[i] - ys[i - 1]) / h[i - 1]);
    }

    const cp = new Float64Array(n), dp = new Float64Array(n), m = new Float64Array(n);
    cp[1] = sup[1] / diag[1];
    dp[1] = rhs[1] / diag[1];
    for (let i = 2; i < n - 1; i++) {
      const den = diag[i] - sub[i] * cp[i - 1];
      cp[i] = sup[i] / den;
      dp[i] = (rhs[i] - sub[i] * dp[i - 1]) / den;
    }
    m[n - 2] = dp[n - 2];
    for (let i = n - 3; i >= 1; i--) m[i] = dp[i] - cp[i] * m[i + 1];

    let j = 0;
    for (let q = 0; q < xq.length; q++) {
      const x = xq[q];
      while (j < n - 2 && x > xs[j + 1]) j++;
      while (j > 0 && x < xs[j]) j--;
      const hj = h[j];
      const A = (xs[j + 1] - x) / hj, B = (x - xs[j]) / hj;
      out[q] = A * ys[j] + B * ys[j + 1] +
               ((A * A * A - A) * m[j] + (B * B * B - B) * m[j + 1]) * hj * hj / 6;
    }
    return out;
  }

  /* ---------- 2. local extrema -------------------------------
     Plateaux are collapsed to their centre so that a flat top
     yields exactly one maximum.                                */
  function findExtrema(y) {
    const maxI = [], minI = [], n = y.length;
    for (let i = 1; i < n - 1; i++) {
      if (y[i] > y[i - 1] && y[i] >= y[i + 1]) {
        if (y[i] === y[i + 1]) {
          let k = i + 1;
          while (k < n - 1 && y[k] === y[i]) k++;
          if (y[k] < y[i]) maxI.push((i + k - 1) >> 1);
          i = k - 1;
        } else maxI.push(i);
      } else if (y[i] < y[i - 1] && y[i] <= y[i + 1]) {
        if (y[i] === y[i + 1]) {
          let k = i + 1;
          while (k < n - 1 && y[k] === y[i]) k++;
          if (y[k] > y[i]) minI.push((i + k - 1) >> 1);
          i = k - 1;
        } else minI.push(i);
      }
    }
    return { maxI, minI };
  }

  /* ---------- 3. envelopes -----------------------------------
     The two envelopes are cubic splines through the maxima and
     through the minima.  Both ends are mirrored (Rilling's
     boundary conditions): the extrema near an edge are reflected
     about the outermost extremum -- or about the edge sample
     itself when the signal already overshoots that extremum --
     so the spline interpolates across [0, n-1] instead of
     extrapolating.  Skipping this makes the first and last ~10%
     of every envelope visibly wrong: the classic "end effect".  */
  const N_MIRROR = 2;
  const CFG = { boundary: 'linear' };   /* 'linear' | 'mirror' */

  function takeRev(arr, from, count) {
    const out = [];
    for (let i = Math.min(from + count, arr.length) - 1; i >= from; i--) out.push(arr[i]);
    return out;                       /* descending order */
  }
  function takeRevEnd(arr, skipFromEnd, count) {
    const last = arr.length - 1 - skipFromEnd;
    const out = [];
    for (let i = last; i > last - count && i >= 0; i--) out.push(arr[i]);
    return out;                       /* descending order */
  }

  /* Returns mirrored knot sets for both envelopes at once. */
  function extendExtrema(y, maxI, minI) {
    const n = y.length, lx = n - 1, nb = N_MIRROR;
    let lmax, lmin, lsym, rmax, rmin, rsym;

    /* ----- left edge ----- */
    if (maxI[0] < minI[0]) {
      if (y[0] > y[minI[0]]) {
        lmax = takeRev(maxI, 1, nb); lmin = takeRev(minI, 0, nb); lsym = maxI[0];
      } else {
        lmax = takeRev(maxI, 0, nb); lmin = takeRev(minI, 0, nb - 1).concat([0]); lsym = 0;
      }
    } else {
      if (y[0] < y[maxI[0]]) {
        lmax = takeRev(maxI, 0, nb); lmin = takeRev(minI, 1, nb); lsym = minI[0];
      } else {
        lmax = takeRev(maxI, 0, nb - 1).concat([0]); lmin = takeRev(minI, 0, nb); lsym = 0;
      }
    }

    /* ----- right edge ----- */
    if (maxI[maxI.length - 1] < minI[minI.length - 1]) {
      if (y[lx] < y[maxI[maxI.length - 1]]) {
        rmax = takeRevEnd(maxI, 0, nb); rmin = takeRevEnd(minI, 1, nb); rsym = minI[minI.length - 1];
      } else {
        rmax = [lx].concat(takeRevEnd(maxI, 0, nb - 1)); rmin = takeRevEnd(minI, 0, nb); rsym = lx;
      }
    } else {
      if (y[lx] > y[minI[minI.length - 1]]) {
        rmax = takeRevEnd(maxI, 1, nb); rmin = takeRevEnd(minI, 0, nb); rsym = maxI[maxI.length - 1];
      } else {
        rmax = takeRevEnd(maxI, 0, nb); rmin = [lx].concat(takeRevEnd(minI, 0, nb - 1)); rsym = lx;
      }
    }

    function build(mirrorL, core, mirrorR) {
      const xs = [], ys = [];
      for (let i = mirrorL.length - 1; i >= 0; i--) {      /* ascending */
        xs.push(2 * lsym - mirrorL[i]); ys.push(y[mirrorL[i]]);
      }
      for (let i = 0; i < core.length; i++) { xs.push(core[i]); ys.push(y[core[i]]); }
      for (let i = 0; i < mirrorR.length; i++) {
        xs.push(2 * rsym - mirrorR[i]); ys.push(y[mirrorR[i]]);
      }
      /* strictly increasing abscissae */
      const X = [], Y = [];
      for (let i = 0; i < xs.length; i++) {
        if (!X.length || xs[i] > X[X.length - 1]) { X.push(xs[i]); Y.push(ys[i]); }
      }
      /* guarantee the knots span [0, n-1]: if the mirror did not
         reach past an edge, reflect the outermost knot about it */
      if (X[0] > 0) {
        const s = X.length > 1 ? (Y[1] - Y[0]) / (X[1] - X[0]) : 0;
        X.unshift(-X[0]); Y.unshift(Y[0] - s * (X[1] - X[0]) * 2);
      }
      if (X[X.length - 1] < lx) {
        const m = X.length;
        const s = m > 1 ? (Y[m - 1] - Y[m - 2]) / (X[m - 1] - X[m - 2]) : 0;
        const d = lx - X[m - 1];
        X.push(lx + d); Y.push(Y[m - 1] + s * 2 * d);
      }
      return { X, Y };
    }

    return {
      up: build(lmax, maxI, rmax),
      lo: build(lmin, minI, rmin)
    };
  }

  function splineAt(knots, n) {
    const xq = new Float64Array(n);
    for (let i = 0; i < n; i++) xq[i] = i;
    return cubicSpline(knots.X, knots.Y, xq);
  }

  /* Alternative boundary treatment: linear extrapolation from
     the two outermost extrema of the same kind, clamped so the
     envelope neither crosses the signal at the edge nor leaves
     the global range.  Kept switchable because the two schemes
     trade off differently (see test/compare-boundary.js).      */
  function extendLinear(y, idx, isUpper) {
    const n = y.length;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < n; i++) { if (y[i] < minY) minY = y[i]; if (y[i] > maxY) maxY = y[i]; }
    const X = [], Y = [];
    if (idx[0] !== 0) {
      let v;
      if (idx.length >= 2) {
        const sl = (y[idx[1]] - y[idx[0]]) / (idx[1] - idx[0]);
        v = y[idx[0]] - sl * idx[0];
      } else v = y[idx[0]];
      v = isUpper ? Math.min(Math.max(v, y[0]), maxY) : Math.max(Math.min(v, y[0]), minY);
      X.push(0); Y.push(v);
    }
    for (let i = 0; i < idx.length; i++) { X.push(idx[i]); Y.push(y[idx[i]]); }
    const last = idx[idx.length - 1];
    if (last !== n - 1) {
      let v;
      if (idx.length >= 2) {
        const p = idx[idx.length - 2];
        const sl = (y[last] - y[p]) / (last - p);
        v = y[last] + sl * (n - 1 - last);
      } else v = y[last];
      v = isUpper ? Math.min(Math.max(v, y[n - 1]), maxY) : Math.max(Math.min(v, y[n - 1]), minY);
      X.push(n - 1); Y.push(v);
    }
    return { X, Y };
  }

  /* Both envelopes in one call (what the sifting loop uses). */
  function envelopes(y, maxI, minI) {
    const n = y.length;
    if (maxI.length === 0 || minI.length === 0 || maxI.length + minI.length < 3) {
      const flat = new Float64Array(n), flat2 = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        flat[i] = y[0] + (y[n - 1] - y[0]) * i / (n - 1);
        flat2[i] = flat[i];
      }
      return { up: flat, lo: flat2 };
    }
    if (CFG.boundary === 'linear') {
      return {
        up: splineAt(extendLinear(y, maxI, true), n),
        lo: splineAt(extendLinear(y, minI, false), n)
      };
    }
    const k = extendExtrema(y, maxI, minI);
    return { up: splineAt(k.up, n), lo: splineAt(k.lo, n) };
  }

  /* Public single-envelope helper, kept for the API in the spec.
     isUpper is optional; when omitted it is inferred from the
     mean level of the given extrema.                           */
  function envelope(y, idx, isUpper) {
    const ex = findExtrema(y);
    if (isUpper === undefined) {
      let sExt = 0, sAll = 0;
      for (let i = 0; i < idx.length; i++) sExt += y[idx[i]];
      for (let i = 0; i < y.length; i++) sAll += y[i];
      isUpper = (idx.length ? sExt / idx.length : 0) >= sAll / y.length;
    }
    const e = envelopes(y, isUpper ? idx : ex.maxI, isUpper ? ex.minI : idx);
    return isUpper ? e.up : e.lo;
  }

  /* ---------- 4. one sifting pass ---------------------------- */
  function siftOnce(h) {
    const { maxI, minI } = findExtrema(h);
    const e = envelopes(h, maxI, minI);
    const up = e.up, lo = e.lo;
    const n = h.length;
    const mean = new Float64Array(n), hNew = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      mean[i] = (up[i] + lo[i]) / 2;
      hNew[i] = h[i] - mean[i];
    }
    return { up, lo, mean, hNew, maxI, minI };
  }

  /* ---------- zero crossings --------------------------------- */
  function countZeroCrossings(y) {
    let c = 0;
    for (let i = 1; i < y.length; i++) {
      if ((y[i - 1] < 0 && y[i] > 0) || (y[i - 1] > 0 && y[i] < 0)) c++;
      else if (y[i] === 0 && y[i - 1] !== 0) {
        let k = i + 1;
        while (k < y.length && y[k] === 0) k++;
        if (k < y.length && Math.sign(y[k]) !== Math.sign(y[i - 1])) c++;
        i = k;
      }
    }
    return c;
  }

  /* ---------- 5. the two IMF conditions ----------------------
     C1  |#extrema - #zero crossings| <= 1
     C2  max|envelope mean| / signal amplitude < 0.05           */
  function imfCheck(h) {
    const s = siftOnce(h);
    const n = h.length;
    const nExt = s.maxI.length + s.minI.length;
    const nZero = countZeroCrossings(h);
    const c1 = Math.abs(nExt - nZero) <= 1;

    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < n; i++) { if (h[i] < mn) mn = h[i]; if (h[i] > mx) mx = h[i]; }
    const amp = (mx - mn) / 2;

    let mmax = 0;
    for (let i = 0; i < n; i++) { const a = Math.abs(s.mean[i]); if (a > mmax) mmax = a; }

    const sym = amp > 0 ? mmax / amp : 0;
    const c2 = sym < 0.05;
    return { nExt, nZero, c1, c2, sym, ok: c1 && c2,
             maxI: s.maxI, minI: s.minI, up: s.up, lo: s.lo, mean: s.mean, hNew: s.hNew };
  }

  /* ---------- 6. full sifting (SD stopping criterion) --------- */
  const SD_THRESHOLD = 0.2;
  const MAX_SIFT = 12;

  function sift(y) {
    let h = Float64Array.from(y);
    for (let it = 0; it < MAX_SIFT; it++) {
      const s = siftOnce(h);
      if (s.maxI.length + s.minI.length < 3) break;
      let num = 0, den = 0;
      for (let i = 0; i < h.length; i++) {
        const d = h[i] - s.hNew[i];
        num += d * d;
        den += h[i] * h[i] + 1e-12;
      }
      h = s.hNew;
      if (num / den < SD_THRESHOLD) break;
    }
    return h;
  }

  /* ---------- 7. EMD ----------------------------------------- */
  function emd(y, maxImf) {
    maxImf = maxImf || 8;
    const n = y.length;
    let r = Float64Array.from(y);
    const imfs = [];
    let e0 = 0;
    for (let i = 0; i < n; i++) e0 += y[i] * y[i];

    while (imfs.length < maxImf) {
      const ex = findExtrema(r);
      if (ex.maxI.length + ex.minI.length < 3) break;
      const imf = sift(r);
      const next = new Float64Array(n);
      let e = 0;
      for (let i = 0; i < n; i++) { next[i] = r[i] - imf[i]; e += next[i] * next[i]; }
      imfs.push(imf);
      r = next;
      if (e < 1e-10 * e0) break;
    }
    return { imfs, residue: r };
  }

  /* ---------- 8. FFT (iterative radix-2, in place) ------------ */
  function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

  function fft(re, im) {
    const n = re.length;
    if (n <= 1) return;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len;
      const wr = Math.cos(ang), wi = Math.sin(ang);
      const half = len >> 1;
      for (let i = 0; i < n; i += len) {
        let cwr = 1, cwi = 0;
        for (let k = 0; k < half; k++) {
          const ar = re[i + k], ai = im[i + k];
          const br = re[i + k + half], bi = im[i + k + half];
          const vr = br * cwr - bi * cwi;
          const vi = br * cwi + bi * cwr;
          re[i + k] = ar + vr; im[i + k] = ai + vi;
          re[i + k + half] = ar - vr; im[i + k + half] = ai - vi;
          const nwr = cwr * wr - cwi * wi;
          cwi = cwr * wi + cwi * wr;
          cwr = nwr;
        }
      }
    }
  }

  function ifft(re, im) {
    const n = re.length;
    for (let i = 0; i < n; i++) im[i] = -im[i];
    fft(re, im);
    for (let i = 0; i < n; i++) { re[i] /= n; im[i] = -im[i] / n; }
  }

  /* single-sided amplitude spectrum */
  function spectrum(x, fs) {
    const n = x.length, N = nextPow2(n);
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < n; i++) re[i] = x[i];
    fft(re, im);
    const half = (N >> 1) + 1;
    const freq = new Float64Array(half), amp = new Float64Array(half);
    for (let k = 0; k < half; k++) {
      freq[k] = k * fs / N;
      const mag = Math.sqrt(re[k] * re[k] + im[k] * im[k]) / n;
      amp[k] = (k === 0 || k === N >> 1) ? mag : 2 * mag;
    }
    return { freq, amp };
  }

  /* ---------- 9. Hilbert transform ---------------------------
     Analytic signal through the FFT: keep DC and Nyquist,
     double the positive frequencies, zero the negative ones.
     Instantaneous frequency = unwrapped phase difference.      */
  function hilbert(x, fs) {
    const n = x.length, N = nextPow2(n);
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < n; i++) re[i] = x[i];
    fft(re, im);
    const half = N >> 1;
    for (let k = 1; k < half; k++) { re[k] *= 2; im[k] *= 2; }
    for (let k = half + 1; k < N; k++) { re[k] = 0; im[k] = 0; }
    ifft(re, im);

    const amp = new Float64Array(n), phase = new Float64Array(n), freq = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      amp[i] = Math.hypot(re[i], im[i]);
      phase[i] = Math.atan2(im[i], re[i]);
    }
    const TWO_PI = 2 * Math.PI;
    for (let i = 0; i < n - 1; i++) {
      let d = phase[i + 1] - phase[i];
      while (d > Math.PI) d -= TWO_PI;
      while (d < -Math.PI) d += TWO_PI;
      freq[i] = d * fs / TWO_PI;
    }
    freq[n - 1] = n > 1 ? freq[n - 2] : 0;
    return { amp, phase, freq, real: re.subarray(0, n), imag: im.subarray(0, n) };
  }

  /* ---------- helpers used by the UI and the tests ----------- */
  function zeroCrossingFreq(x, fs) {
    return countZeroCrossings(x) * fs / (2 * x.length);
  }
  function peakAmp(x) {
    let m = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > m) m = a; }
    return m;
  }
  function energy(x) {
    let e = 0;
    for (let i = 0; i < x.length; i++) e += x[i] * x[i];
    return e;
  }
  function correlation(a, b, from, to) {
    from = from || 0; to = (to === undefined) ? a.length : to;
    let ma = 0, mb = 0;
    const m = to - from;
    for (let i = from; i < to; i++) { ma += a[i]; mb += b[i]; }
    ma /= m; mb /= m;
    let sab = 0, saa = 0, sbb = 0;
    for (let i = from; i < to; i++) {
      const da = a[i] - ma, db = b[i] - mb;
      sab += da * db; saa += da * da; sbb += db * db;
    }
    return sab / Math.sqrt(saa * sbb);
  }

  /* Hilbert spectrum: max instantaneous amplitude on a
     time x frequency grid, assembled over all IMFs.           */
  function hilbertSpectrum(imfs, fs, opts) {
    const nT = opts.nT, nF = opts.nF, fMax = opts.fMax;
    const sT = opts.spreadT === undefined ? 1 : opts.spreadT;
    const sF = opts.spreadF === undefined ? 1 : opts.spreadF;
    const n = imfs.length ? imfs[0].length : 0;
    const grid = new Float64Array(nT * nF);
    for (let k = 0; k < imfs.length; k++) {
      const h = hilbert(imfs[k], fs);
      for (let i = 0; i < n; i++) {
        const f = h.freq[i];
        if (!(f > 0) || f >= fMax) continue;
        const ti = Math.min(nT - 1, Math.floor(i / n * nT));
        const fi = Math.min(nF - 1, Math.floor(f / fMax * nF));
        /* one sample is one point; smear it over a couple of cells so a
           continuous ridge reads as a ridge instead of scattered dots */
        for (let df = -sF; df <= sF; df++) {
          const y = fi + df;
          if (y < 0 || y >= nF) continue;
          const wf = 1 - 0.45 * Math.abs(df);
          for (let dt = -sT; dt <= sT; dt++) {
            const x = ti + dt;
            if (x < 0 || x >= nT) continue;
            const v = h.amp[i] * wf * (1 - 0.25 * Math.abs(dt));
            const q = y * nT + x;
            if (v > grid[q]) grid[q] = v;
          }
        }
      }
    }
    return { grid, nT, nF, fMax };
  }

  const EMD = {
    cubicSpline, findExtrema, envelope, envelopes, siftOnce, imfCheck, sift, emd,
    fft, ifft, spectrum, hilbert, hilbertSpectrum,
    countZeroCrossings, zeroCrossingFreq, peakAmp, energy, correlation,
    nextPow2, SD_THRESHOLD, MAX_SIFT, CFG
  };

/* ============================================================
   signals.js — synthetic signals shared by the tests and the UI
   Every waveform is deterministic: the same arguments always
   produce the same samples, so the numbers quoted on the page
   can be reproduced by the Node test suite.
   ============================================================ */
'use strict';
(function (global) {

  /* deterministic PRNG (mulberry32) — no Math.random anywhere */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* approximately normal, via the sum of 4 uniforms */
  function gaussNoise(n, sigma, seed) {
    const r = rng(seed), out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const u = r() + r() + r() + r() - 2;
      out[i] = u * sigma * 0.8660254;
    }
    return out;
  }
  /* Gaussian window — written without ** on a negated value,
     which is a syntax error in JavaScript. */
  function gauss(t, t0, sd) {
    const a = (t - t0) / sd;
    return Math.exp(-(a * a));
  }
  function timeAxis(n, fs) {
    const t = new Float64Array(n);
    for (let i = 0; i < n; i++) t[i] = i / fs;
    return t;
  }

  /* ---------- tab 1: the teaching signal ---------------------
     Chosen so the sifting process needs several rounds before
     both IMF conditions hold — otherwise the demo would pass
     on round 1 and show nothing.                              */
  function teachingSignal() {
    const fs = 64, n = 256;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      y[i] = 3 * Math.sin(2 * Math.PI * 1.75 * ti)
           + 2.2 * Math.sin(2 * Math.PI * 0.8 * ti + 1)
           + 5 * Math.sin(Math.PI * ti / 4);
    }
    return { t, y, fs, n };
  }

  /* ---------- tab 2: five sleep stages ----------------------- */
  const SLEEP_FS = 100, SLEEP_N = 1024;

  function sleepSignal(stage, noiseLevel) {
    const fs = SLEEP_FS, n = SLEEP_N;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    const dur = n / fs;

    for (let i = 0; i < n; i++) {
      const ti = t[i];
      let v = 0;

      switch (stage) {
        case 'wake': {
          /* 8-13 Hz alpha with slow amplitude modulation
             (alpha bursts), plus ~19 Hz beta. Low voltage. */
          const burst = 0.55 + 0.45 * Math.sin(2 * Math.PI * 0.35 * ti - 0.6);
          v += 24 * burst * Math.sin(2 * Math.PI * 10.2 * ti);
          v += 6 * Math.sin(2 * Math.PI * 11.8 * ti + 2.1);
          v += 3.5 * Math.sin(2 * Math.PI * 19.3 * ti + 0.8);
          v += 5 * Math.sin(2 * Math.PI * 2.2 * ti + 1.4);
          break;
        }
        case 'n1': {

          const fade = Math.exp(-ti / 3.2);
          v += 34 * Math.sin(2 * Math.PI * 6.0 * ti);
          v += 26 * fade * Math.sin(2 * Math.PI * 9.8 * ti + 0.5);
          v += 10 * Math.sin(2 * Math.PI * 3.1 * ti + 2.4);
          v += 3 * Math.sin(2 * Math.PI * 16.0 * ti + 1.1);
          break;
        }
        case 'n2': {
          /* background + two sleep spindles + one K-complex */
          v += 20 * Math.sin(2 * Math.PI * 1.1 * ti + 0.4);
          v += 7 * Math.sin(2 * Math.PI * 4.4 * ti + 1.9);
          v += 36 * gauss(ti, 2.3, 0.45) * Math.sin(2 * Math.PI * 13.1 * (ti - 2.3));
          v += 32 * gauss(ti, 7.4, 0.45) * Math.sin(2 * Math.PI * 12.7 * (ti - 7.4));

             positive one */
          const kt = 5.0;
          v += -85 * gauss(ti, kt, 0.13);
          v += 55 * gauss(ti, kt + 0.34, 0.26);
          break;
        }
        case 'n3': {
          /* 0.5-2 Hz slow wave activity, up to ~150 uV */
          v += 95 * Math.sin(2 * Math.PI * 0.8 * ti);
          v += 32 * Math.sin(2 * Math.PI * 1.7 * ti + 1.0);
          v += 22 * Math.sin(2 * Math.PI * 0.45 * ti + 2.6);
          v += 7 * Math.sin(2 * Math.PI * 5.5 * ti + 0.3);
          v += 3 * Math.sin(2 * Math.PI * 11.0 * ti + 1.7);
          break;
        }
        case 'rem': {
          /* low voltage mixed frequency + sawtooth waves */
          v += 24 * Math.sin(2 * Math.PI * 5.6 * ti);
          v += 10 * Math.sin(2 * Math.PI * 7.4 * ti + 1.3);

          const win = gauss(ti, dur * 0.52, 1.5);
          const ph = (2.6 * ti) % 1;
          v += 26 * win * (2 * ph - 1);
          v += 3 * Math.sin(2 * Math.PI * 15.5 * ti + 0.9);
          break;
        }
      }
      y[i] = v;
    }

    if (noiseLevel > 0) {
      const nz = gaussNoise(n, noiseLevel, 20260923);
      for (let i = 0; i < n; i++) y[i] += nz[i];
    }
    return { t, y, fs, n };
  }

  const SLEEP_STAGES = ['wake', 'n1', 'n2', 'n3', 'rem'];

  /* ---------- tab 3: one spindle on a slow background --------- */
  function spindleSignal(t0, f0) {
    const fs = SLEEP_FS, n = SLEEP_N;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    const nz = gaussNoise(n, 0.25, 777);
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      let v = 0;
      v += 9 * Math.sin(2 * Math.PI * 0.8 * ti + 0.3);
      v += 4.5 * Math.sin(2 * Math.PI * 3.6 * ti + 1.7);
      v += 26 * gauss(ti, t0, 0.42) * Math.sin(2 * Math.PI * f0 * (ti - t0));
      y[i] = v + nz[i];

  }

  /* ---------- test signal of section 5 ----------------------- */
  function testSignal() {
    const fs = 100, n = 1024;
    const t = timeAxis(n, fs);
    const y = new Float64Array(n), fast = new Float64Array(n), slow = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      fast[i] = 3 * Math.sin(2 * Math.PI * 13 * t[i]);
      slow[i] = 5 * Math.sin(2 * Math.PI * 1.5 * t[i]);
      y[i] = fast[i] + slow[i];
    }
    return { t, y, fast, slow, fs, n };
  }

  const BANDS = [
    { key: 'delta', lo: 0.5, hi: 4 },
    { key: 'theta', lo: 4, hi: 8 },
    { key: 'alpha', lo: 8, hi: 13 },
    { key: 'beta',  lo: 13, hi: 30 },
    { key: 'gamma', lo: 30, hi: 100 }
  ];

    for (let i = 0; i < BANDS.length; i++) if (f >= BANDS[i].lo && f < BANDS[i].hi) return BANDS[i].key;

  }

    rng, gaussNoise, gauss, timeAxis,

  const MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace';

  /* ---------- language & theme ------------------------------ */
  let LANG = 'zh';
  let S = I18N.STR.zh;

  function initPrefs() {
    try {
      const l = localStorage.getItem('emd-lang');
      if (l === 'zh' || l === 'en') LANG = l;
      const t = localStorage.getItem('emd-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode: fall back to the defaults */ }
    S = I18N.STR[LANG];
  }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function currentTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  /* ---------- colours straight from the stylesheet ---------- */
  let COL = {};
  function readColours() {
    const cs = getComputedStyle(document.documentElement);
    ['night', 'panel', 'haze', 'text', 'text-dim', 'trace', 'coral', 'cyan', 'sage', 'violet']
      .forEach(k => { COL[k] = cs.getPropertyValue('--' + k).trim(); });
  }
  function hex2rgb(h) {
    h = (h || '').trim();
    if (h.charAt(0) === '#') {
      if (h.length === 4) return [parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16), parseInt(h[3] + h[3], 16)];
      return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
    }
    const m = h.match(/[\d.]+/g);
    return m ? [+m[0], +m[1], +m[2]] : [0, 0, 0];
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  /* ---------- canvas plumbing -------------------------------
     devicePixelRatio is handled here; a hidden tab reports a
     client width of 0, so we simply skip and redraw on show.  */
  function ctxOf(cv, cssH) {
    const w = cv.clientWidth;
    if (!w) return null;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(cssH * dpr));
    cv.style.height = cssH + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, cssH);
    return { ctx: ctx, w: w, h: cssH };
  }

  function makePlot(cv, cssH, o) {
    const c = ctxOf(cv, cssH);
    if (!c) return null;
    o = Object.assign({ padL: 40, padR: 10, padT: 10, padB: 20 }, o);
    const x0 = o.padL, x1 = c.w - o.padR, y0 = o.padT, y1 = c.h - o.padB;
    const dx = (o.xMax - o.xMin) || 1, dy = (o.yMax - o.yMin) || 1;
    return {
      ctx: c.ctx, w: c.w, h: c.h, x0: x0, x1: x1, y0: y0, y1: y1, o: o,
      X: v => x0 + (v - o.xMin) / dx * (x1 - x0),
      Y: v => y1 - (v - o.yMin) / dy * (y1 - y0)
    };
  }

  function niceTicks(lo, hi, n) {
    const raw = (hi - lo) / Math.max(1, n);
    const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const norm = raw / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  }

  function axes(p, o) {
    o = o || {};
    const ctx = p.ctx;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = COL.haze;
    ctx.font = '10px ' + MONO;
    ctx.fillStyle = COL['text-dim'];
    if (o.yTicks !== false) {
      const yt = o.yTicks || niceTicks(p.o.yMin, p.o.yMax, 3);
      yt.forEach(v => {
        const Y = Math.round(p.Y(v)) + 0.5;
        if (Y < p.y0 - 1 || Y > p.y1 + 1) return;
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(p.x0, Y); ctx.lineTo(p.x1, Y); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(o.yFmt ? o.yFmt(v) : String(v), p.x0 - 6, Y);
      });
    }
    if (o.xTicks !== false) {
      const xt = o.xTicks || niceTicks(p.o.xMin, p.o.xMax, 6);
      xt.forEach(v => {
        const X = Math.round(p.X(v)) + 0.5;
        if (X < p.x0 - 1 || X > p.x1 + 1) return;
        ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.moveTo(X, p.y0); ctx.lineTo(X, p.y1); ctx.stroke();
        ctx.globalAlpha = 1;
        if (o.xLabels !== false) {
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText(o.xFmt ? o.xFmt(v) : String(v), X, p.y1 + 5);
        }
      });
    }
    ctx.restore();
  }

  function series(p, ys, xs, colour, width, dash, alpha) {
    const ctx = p.ctx;
    ctx.save();
    if (dash) ctx.setLineDash(dash);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.strokeStyle = colour;
    ctx.lineWidth = width || 1.4;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < ys.length; i++) {
      const X = p.X(xs ? xs[i] : i), Y = p.Y(ys[i]);
      if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function dots(p, idx, ys, xs, colour, filled) {
    const ctx = p.ctx;
    ctx.save();
    ctx.strokeStyle = colour; ctx.fillStyle = colour; ctx.lineWidth = 1.3;
    for (let k = 0; k < idx.length; k++) {
      const i = idx[k];
      ctx.beginPath();
      ctx.arc(p.X(xs ? xs[i] : i), p.Y(ys[i]), 2.6, 0, Math.PI * 2);
      if (filled) ctx.fill(); else ctx.stroke();
    }
    ctx.restore();
  }

  function span(arr, pad) {
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < arr.length; i++) {
      for (let j = 0; j < arr[i].length; j++) {
        const v = arr[i][j];
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
    }
    if (!isFinite(mn)) { mn = -1; mx = 1; }
    const m = (mx - mn) * (pad === undefined ? 0.12 : pad) || 1;
    return { yMin: mn - m, yMax: mx + m };
  }

  /* ==========================================================
     HERO STRIP — a page of polysomnograph paper
     ========================================================== */
  const HERO = { sig: null, dec: null };
  function heroCompute() {
    HERO.sig = SIGNALS.sleepSignal('n3', 2);
    HERO.dec = EMD.emd(HERO.sig.y, 4);
  }
  function drawHero() {
    const cv = $('#heroCanvas');
    const c = ctxOf(cv, cv.clientWidth < 560 ? 220 : 300);
    if (!c) return;
    const ctx = c.ctx, sig = HERO.sig;
    const rows = [sig.y].concat(HERO.dec.imfs, [HERO.dec.residue]);
    const nR = rows.length;
    const padL = 8, padR = 8;
    const rowH = c.h / nR;

    /* faint chart-paper ruling */
    ctx.save();
    ctx.strokeStyle = COL.haze; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    for (let k = 1; k < nR; k++) {
      const y = Math.round(k * rowH) + 0.5;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(c.w - padR, y); ctx.stroke();
    }
    ctx.globalAlpha = 0.22;
    for (let s = 1; s < 10; s++) {
      const x = Math.round(padL + (c.w - padL - padR) * s / 10) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.h); ctx.stroke();
    }
    ctx.restore();

    rows.forEach((r, k) => {
      const top = k * rowH, mid = top + rowH / 2;
      let mx = 0;
      for (let i = 0; i < r.length; i++) mx = Math.max(mx, Math.abs(r[i]));
      const sc = mx > 0 ? (rowH * 0.40) / mx : 0;
      ctx.save();
      ctx.strokeStyle = k === 0 ? COL.trace : COL.trace;
      ctx.globalAlpha = k === 0 ? 1 : 0.55;
      ctx.lineWidth = k === 0 ? 1.5 : 1.1;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < r.length; i++) {
        const x = padL + (c.w - padL - padR) * i / (r.length - 1);
        const y = mid - r[i] * sc;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    });
  }

  /* ==========================================================
     TAB 1 — the sifting algorithm, one frame at a time
     ========================================================== */
  const T1 = { sig: null, cur: null, s: null, chk: null, round: 1, step: 0, done: false, pos: 120 };

  function t1Reset() {
    T1.sig = SIGNALS.teachingSignal();
    T1.cur = Float64Array.from(T1.sig.y);
    T1.round = 1; T1.step = 0; T1.done = false;
    t1Compute();
  }
  function t1Compute() {
    T1.s = EMD.siftOnce(T1.cur);
    T1.chk = EMD.imfCheck(T1.s.hNew);
  }
  function t1Next() {
    if (T1.done) { t1Reset(); render1(); return; }
    if (T1.step < 6) T1.step++;
    else if (T1.chk.ok) T1.done = true;
    else { T1.cur = T1.s.hNew; T1.round++; T1.step = 1; t1Compute(); }
    render1();
  }

  function render1() {
    const sig = T1.sig, st = T1.step, s = T1.s;
    const t = sig.t;

    /* ---- headline ---- */
    $('#t1Round').textContent = fmt(S.p1Round, T1.round);
    $('#t1StepNo').textContent = fmt(S.p1Step, st);
    $('#t1StepText').textContent = S.steps[st];
    $('#t1Next').textContent = T1.done ? S.p1Reset : S.p1Next;

    /* ---- main plot ---- */
    const showUp = st >= 2, showLo = st >= 3, showMean = st >= 4, showExt = st >= 1;
    const stack = [T1.cur];
    if (showUp) stack.push(s.up);
    if (showLo) stack.push(s.lo);
    const rng = span(stack, 0.1);
    const p = makePlot($('#t1Main'), 260, {
      xMin: t[0], xMax: t[t.length - 1], yMin: rng.yMin, yMax: rng.yMax
    });
    if (p) {
      axes(p, { yFmt: v => v.toFixed(0), xFmt: v => v.toFixed(1) });
      if (showUp) series(p, s.up, t, COL.cyan, 1.3);
      if (showLo) series(p, s.lo, t, COL.cyan, 1.3, [4, 4]);
      if (showMean) series(p, s.mean, t, COL.sage, 1.6);
      series(p, T1.cur, t, COL.trace, 1.7);
      if (showExt) {
        dots(p, s.maxI, T1.cur, t, COL.coral, true);
        dots(p, s.minI, T1.cur, t, COL.coral, false);
      }
      /* the sample the table is reading */
      const p1 = p, i0 = T1.pos;
      p1.ctx.save();
      p1.ctx.strokeStyle = COL.trace; p1.ctx.globalAlpha = 0.35; p1.ctx.setLineDash([3, 3]);
      p1.ctx.beginPath(); p1.ctx.moveTo(p1.X(t[i0]), p1.y0); p1.ctx.lineTo(p1.X(t[i0]), p1.y1); p1.ctx.stroke();
      p1.ctx.restore();
    }

    /* ---- h plot ---- */
    const hWrap = $('#t1HWrap');
    if (st >= 5) {
      hWrap.classList.remove('is-waiting');
      $('#t1HNote').textContent = '';
      const r2 = span([s.hNew], 0.12);
      const q = makePlot($('#t1H'), 150, { xMin: t[0], xMax: t[t.length - 1], yMin: r2.yMin, yMax: r2.yMax });
      if (q) {
        axes(q, { yFmt: v => v.toFixed(0), xFmt: v => v.toFixed(1) });
        q.ctx.save();
        q.ctx.strokeStyle = COL.haze; q.ctx.lineWidth = 1;
        q.ctx.beginPath(); q.ctx.moveTo(q.x0, Math.round(q.Y(0)) + 0.5); q.ctx.lineTo(q.x1, Math.round(q.Y(0)) + 0.5); q.ctx.stroke();
        q.ctx.restore();
        series(q, s.hNew, t, COL.trace, 1.6);
      }
    } else {
      hWrap.classList.add('is-waiting');
      $('#t1HNote').textContent = S.p1Wait;
      const c = ctxOf($('#t1H'), 150);
      if (c) { /* cleared */ }
    }

    /* ---- legend ---- */
    const L = [];
    L.push('<span><i style="background:' + COL.trace + '"></i>' + S.legSignal + '</span>');
    if (showExt) {
      L.push('<span><i class="dot" style="background:' + COL.coral + '"></i>' + S.legMax + '</span>');
      L.push('<span><i class="dot" style="border:1.4px solid ' + COL.coral + ';background:none;height:5px;width:5px"></i>' + S.legMin + '</span>');
    }
    if (showUp) L.push('<span><i style="background:' + COL.cyan + '"></i>' + S.legUp + '</span>');
    if (showLo) L.push('<span><i style="background:repeating-linear-gradient(90deg,' + COL.cyan + ' 0 4px,transparent 4px 8px)"></i>' + S.legLo + '</span>');
    if (showMean) L.push('<span><i style="background:' + COL.sage + '"></i>' + S.legMean + '</span>');
    $('#t1Legend').innerHTML = L.join('');

    /* ---- IMF conditions ---- */
    const box = $('#t1Checks');
    if (st >= 6) {
      const c = T1.chk;
      const diff = Math.abs(c.nExt - c.nZero);
      box.hidden = false;
      box.innerHTML =
        '<div class="check ' + (c.c1 ? 'ok' : 'no') + '">' +
          '<span class="tag">' + S.c1Tag + '</span>' +
          '<span>' + S.c1Name + '</span>' +
          '<span class="val">' + fmt(S.c1Val, c.nExt, c.nZero, diff) + '</span>' +
        '</div>' +
        '<div class="check ' + (c.c2 ? 'ok' : 'no') + '">' +
          '<span class="tag">' + S.c2Tag + '</span>' +
          '<span>' + S.c2Name + '</span>' +
          '<span class="val">' + fmt(S.c2Val, (c.sym * 100).toFixed(1)) + '</span>' +
        '</div>' +
        '<div class="verdict ' + (c.ok ? 'ok' : 'no') + '">' + (c.ok ? S.verdictOk : S.verdictNo) + '</div>';
    } else {
      box.hidden = true;
      box.innerHTML = '';
    }

    render1Table();
  }

  function render1Table() {
    const s = T1.s, sig = T1.sig, i0 = T1.pos, n = sig.n;
    const from = Math.max(0, Math.min(n - 9, i0 - 4));
    let html = '';
    for (let i = from; i < from + 9 && i < n; i++) {
      html += '<tr' + (i === i0 ? ' class="focus"' : '') + '>' +
        '<td>' + i + '</td>' +
        '<td>' + sig.t[i].toFixed(4) + '</td>' +
        '<td class="c-trace">' + T1.cur[i].toFixed(4) + '</td>' +
        '<td class="c-cyan">' + s.up[i].toFixed(4) + '</td>' +
        '<td class="c-cyan">' + s.lo[i].toFixed(4) + '</td>' +
        '<td class="c-sage">' + s.mean[i].toFixed(4) + '</td>' +
        '<td class="c-trace">' + s.hNew[i].toFixed(4) + '</td>' +
        '</tr>';
    }
    $('#t1Body').innerHTML = html;
    $('#t1PosOut').textContent = 'i = ' + i0;
  }

  /* ==========================================================
     TAB 2 — five sleep stages
     ========================================================== */
  const T2 = { stage: 'n2', noise: 0, sig: null, dec: null, baseF: {} };

  function t2Compute() {
    T2.sig = SIGNALS.sleepSignal(T2.stage, T2.noise);
    T2.dec = EMD.emd(T2.sig.y, 6);
    if (T2.baseF[T2.stage] === undefined) {
      const q = SIGNALS.sleepSignal(T2.stage, 0);
      const d = EMD.emd(q.y, 6);
      T2.baseF[T2.stage] = EMD.zeroCrossingFreq(d.imfs[0], q.fs);
    }
  }

  function render2() {
    $$('#t2Stages .btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stage === T2.stage)));
    $('#t2StageDesc').textContent = S.stageDesc[T2.stage];
    $('#t2NoiseOut').textContent = T2.noise.toFixed(0) + ' ' + S.p2NoiseUnit;

    const rows = [{ label: S.p2Signal, data: T2.sig.y, isSignal: true }];
    T2.dec.imfs.forEach((c, k) => rows.push({ label: 'IMF' + (k + 1), data: c }));
    rows.push({ label: S.p2Residue, data: T2.dec.residue, isResidue: true });

    const host = $('#t2Rows');
    host.innerHTML = rows.map((r, k) => {
      let meta;
      if (r.isSignal) {
        meta = '<b>' + r.label + '</b>' + EMD.peakAmp(r.data).toFixed(0) + ' µV peak';
      } else if (r.isResidue) {
        meta = '<b>' + r.label + '</b>' + EMD.peakAmp(r.data).toFixed(0) + ' µV';
      } else {
        const f = EMD.zeroCrossingFreq(r.data, T2.sig.fs);
        const band = SIGNALS.bandOf(f);
        meta = '<b>' + r.label + '</b>' +
               f.toFixed(1) + ' Hz · ' + EMD.peakAmp(r.data).toFixed(0) + ' µV<br>' +
               '<span class="band">' + (S.p2Band[band] || band) + '</span>';
      }
      return '<div class="imf-row' + (r.isSignal ? ' is-signal' : '') + '">' +
             '<div class="imf-meta">' + meta + '</div>' +
             '<canvas data-row="' + k + '" aria-hidden="true"></canvas></div>';
    }).join('');

    const t = T2.sig.t, tmax = t[t.length - 1];
    $$('canvas', host).forEach((cv, k) => {
      const r = rows[k];
      const rg = span([r.data], 0.15);
      const p = makePlot(cv, r.isSignal ? 74 : 58, {
        xMin: 0, xMax: tmax, yMin: rg.yMin, yMax: rg.yMax,
        padL: 44, padR: 8, padT: 6, padB: k === rows.length - 1 ? 18 : 6
      });
      if (!p) return;
      axes(p, {
        yTicks: [0], yFmt: () => '0',
        xFmt: v => v.toFixed(0),
        xLabels: k === rows.length - 1
      });
      series(p, r.data, t, r.isSignal ? COL.trace : COL.trace, r.isSignal ? 1.5 : 1.2, null, r.isSignal ? 1 : 0.78);
    });

    $('#t2Axis').textContent = 't (s) →  0 … ' + tmax.toFixed(2);

    const f1 = EMD.zeroCrossingFreq(T2.dec.imfs[0], T2.sig.fs);
    $('#t2NoiseNote').textContent = T2.noise === 0
      ? fmt(S.p2NoiseNoteZero, f1.toFixed(1))
      : fmt(S.p2NoiseNote, T2.baseF[T2.stage].toFixed(1), f1.toFixed(1));
  }

  /* ==========================================================
     TAB 3 — Fourier against Hilbert
     ========================================================== */
  const T3 = {
    t0: 4.0, f0: 13,
    track: { f: null, min: Infinity, max: -Infinity },
    sig: null, spec: null, dec: null, hs: null, fAmp: 0, peakT: 0
  };
  const HS = { nT: 240, nF: 120, fMax: 25, spreadT: 1, spreadF: 1 };

  function t3Compute() {
    T3.sig = SIGNALS.spindleSignal(T3.t0, T3.f0);
    T3.spec = EMD.spectrum(T3.sig.y, T3.sig.fs);
    T3.dec = EMD.emd(T3.sig.y, 7);
    T3.hs = EMD.hilbertSpectrum(T3.dec.imfs, T3.sig.fs, HS);

    /* Fourier amplitude in a narrow window around the spindle */
    let best = 0;
    for (let k = 0; k < T3.spec.freq.length; k++) {
      const f = T3.spec.freq[k];
      if (f >= T3.f0 - 0.5 && f <= T3.f0 + 0.5 && T3.spec.amp[k] > best) best = T3.spec.amp[k];
    }
    T3.fAmp = best;
    if (T3.track.f !== T3.f0) { T3.track.f = T3.f0; T3.track.min = best; T3.track.max = best; }
    T3.track.min = Math.min(T3.track.min, best);
    T3.track.max = Math.max(T3.track.max, best);

    /* brightest point of the Hilbert spectrum inside the spindle band */
    let ba = -1, bt = 0;
    for (let k = 0; k < T3.dec.imfs.length; k++) {
      const h = EMD.hilbert(T3.dec.imfs[k], T3.sig.fs);
      for (let i = 20; i < T3.sig.n - 20; i++) {
        if (h.freq[i] >= T3.f0 - 3 && h.freq[i] <= T3.f0 + 3 && h.amp[i] > ba) { ba = h.amp[i]; bt = i / T3.sig.fs; }
      }
    }
    T3.peakT = bt;
  }

  function render3() {
    $('#t3TimeOut').textContent = T3.t0.toFixed(2) + ' s';
    $('#t3FreqOut').textContent = T3.f0.toFixed(1) + ' Hz';

    const t = T3.sig.t, tmax = t[t.length - 1];

    /* input signal */
    const rg = span([T3.sig.y], 0.12);
    const p0 = makePlot($('#t3Sig'), 110, { xMin: 0, xMax: tmax, yMin: rg.yMin, yMax: rg.yMax });
    if (p0) {
      axes(p0, { yFmt: v => v.toFixed(0), xFmt: v => v.toFixed(0) });
      series(p0, T3.sig.y, t, COL.trace, 1.3);
      p0.ctx.save();
      p0.ctx.strokeStyle = COL.coral; p0.ctx.globalAlpha = 0.5; p0.ctx.setLineDash([3, 3]);
      p0.ctx.beginPath(); p0.ctx.moveTo(p0.X(T3.t0), p0.y0); p0.ctx.lineTo(p0.X(T3.t0), p0.y1); p0.ctx.stroke();
      p0.ctx.restore();
    }

    /* ---- Fourier ---- */
    const fMaxPlot = HS.fMax;
    let aMax = 0, kMax = 0;
    for (let k = 0; k < T3.spec.freq.length; k++) {
      if (T3.spec.freq[k] > fMaxPlot) break;
      if (T3.spec.amp[k] > aMax) { aMax = T3.spec.amp[k]; }
      kMax = k;
    }
    const pf = makePlot($('#t3Fourier'), 250, {
      xMin: 0, xMax: fMaxPlot, yMin: 0, yMax: aMax * 1.12 || 1, padL: 44, padB: 32
    });
    if (pf) {
      axes(pf, { yFmt: v => v.toFixed(1), xFmt: v => v.toFixed(0) });
      const ctx = pf.ctx;
      ctx.save();
      ctx.strokeStyle = COL.trace; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let k = 0; k <= kMax; k++) {
        const X = pf.X(T3.spec.freq[k]), Y = pf.Y(T3.spec.amp[k]);
        if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      }
      ctx.stroke();
      ctx.lineTo(pf.X(T3.spec.freq[kMax]), pf.Y(0));
      ctx.lineTo(pf.X(0), pf.Y(0));
      ctx.closePath();
      ctx.globalAlpha = 0.14; ctx.fillStyle = COL.trace; ctx.fill();
      ctx.restore();
      /* marker at the spindle frequency */
      ctx.save();
      ctx.strokeStyle = COL.coral; ctx.globalAlpha = 0.55; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(pf.X(T3.f0), pf.y0); ctx.lineTo(pf.X(T3.f0), pf.y1); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.font = '10px ' + MONO; ctx.fillStyle = COL['text-dim'];
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('Hz', (pf.x0 + pf.x1) / 2, pf.h - 2);
      ctx.restore();
    }

    /* ---- Hilbert spectrum ---- */
    drawHilbert();

    /* ---- readout ---- */
    const spread = T3.track.max > 0
      ? (T3.track.max - T3.track.min) / ((T3.track.max + T3.track.min) / 2) * 100 : 0;
    $('#t3r1').innerHTML = fmt(S.p3r1, T3.f0.toFixed(1), T3.fAmp.toFixed(3), spread.toFixed(2));
    $('#t3r2').innerHTML = fmt(S.p3r2, T3.peakT.toFixed(2), T3.t0.toFixed(2), Math.abs(T3.peakT - T3.t0).toFixed(2));
    $('#t3r3').textContent = S.p3r3;
  }

  function drawHilbert() {
    const cv = $('#t3Hilbert');
    const p = makePlot(cv, 250, { xMin: 0, xMax: T3.sig.t[T3.sig.n - 1], yMin: 0, yMax: HS.fMax, padL: 44, padB: 32 });
    if (!p) return;
    const g = T3.hs, ctx = p.ctx;

    let vmax = 0;
    for (let i = 0; i < g.grid.length; i++) if (g.grid[i] > vmax) vmax = g.grid[i];
    if (vmax <= 0) vmax = 1;

    const bg = hex2rgb(COL.panel), mid = hex2rgb(COL.cyan), hot = hex2rgb(COL.trace);
    const img = ctx.createImageData(g.nT, g.nF);
    for (let fi = 0; fi < g.nF; fi++) {
      const row = (g.nF - 1 - fi) * g.nT;         /* low frequency at the bottom */
      for (let ti = 0; ti < g.nT; ti++) {
        /* gamma correction, or the weak instantaneous amplitudes vanish */
        const v = Math.pow(g.grid[fi * g.nT + ti] / vmax, 0.62);
        const c = v < 0.5 ? mix(bg, mid, v * 2) : mix(mid, hot, (v - 0.5) * 2);
        const q = (row + ti) * 4;
        img.data[q] = c[0]; img.data[q + 1] = c[1]; img.data[q + 2] = c[2]; img.data[q + 3] = 255;
      }
    }
    const off = document.createElement('canvas');
    off.width = g.nT; off.height = g.nF;
    off.getContext('2d').putImageData(img, 0, 0);

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, p.x0, p.y0, p.x1 - p.x0, p.y1 - p.y0);
    ctx.restore();

    axes(p, { yFmt: v => v.toFixed(0), xFmt: v => v.toFixed(0) });

    /* where the spindle actually is */
    ctx.save();
    ctx.strokeStyle = COL.coral; ctx.globalAlpha = 0.6; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.X(T3.t0), p.y0); ctx.lineTo(p.X(T3.t0), p.y1); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.font = '10px ' + MONO; ctx.fillStyle = COL['text-dim'];
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('t (s)', (p.x0 + p.x1) / 2, p.h - 2);
    ctx.save();
    ctx.restore();
    ctx.restore();
  }

  /* ==========================================================
     tabs, language, wiring
     ========================================================== */
  let activeTab = 1;
  function showTab(n) {
    activeTab = n;
    $$('.tab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.tab === n)));
    $$('.panel').forEach(pn => { pn.hidden = +pn.dataset.tab !== n; });
    redrawActive();
  }
  function redrawActive() {
    /* a hidden canvas has zero width, so each tab redraws on show */
    if (activeTab === 1) render1();
    else if (activeTab === 2) render2();
    else render3();
  }

  function applyLang() {
    S = I18N.STR[LANG];
    document.documentElement.lang = S.htmlLang;
    $$('[data-i18n]').forEach(e => {
      const v = S[e.dataset.i18n];
      if (typeof v === 'string') e.innerHTML = v;
    });
    $('#langBtn').textContent = S.langBtn;
    $('#langBtn').title = S.langTitle;
    $('#themeBtn').textContent = currentTheme() === 'dark' ? S.themeBtn : S.themeBtnDark;
    $('#t1Next').textContent = T1.done ? S.p1Reset : S.p1Next;

    $$('#t2Stages .btn').forEach(b => { b.textContent = S.stageNames[b.dataset.stage]; });
    $$('.tab').forEach(b => { b.textContent = S['t' + b.dataset.tab]; });

    buildImplList();
    buildRefs();
    redrawActive();
  }

  function buildImplList() {
    $('#implList').innerHTML = S.implList.map(r =>
      '<li><code class="mono">' + r[0] + '</code> — ' + r[1] + '</li>').join('');
  }

  function buildRefs() {
    const groups = [
      { id: 1, title: S.refG1 }, { id: 2, title: S.refG2 },
      { id: 3, title: S.refG3 }, { id: 4, title: S.refG4 }
    ];
    let html = '';
    groups.forEach(g => {
      html += '<p class="ref-group">' + g.title + '</p><div class="refs">';
      I18N.REFS.filter(r => r.group === g.id).forEach(r => {
        const note = r.n ? S.refNotes[r.n - 1] : S.refSupp;
        html += '<div class="ref">' +
          '<div class="n">' + (r.n ? '[' + r.n + ']' : '—') + '</div>' +
          '<div><p>' + r.cite + ' <em>' + r.title + '</em></p>' +
          '<p class="meta">' + r.where + ' DOI: <a href="https://doi.org/' + r.doi +
          '" target="_blank" rel="noopener">' + r.doi + '</a></p>' +
          (note ? '<p class="gloss">' + note + '</p>' : '') +
          '</div></div>';
      });
      html += '</div>';
    });
    $('#refList').innerHTML = html;
  }

  /* ---------- redraw scheduling ---------- */
  let raf = 0;
  function schedule(fn) {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { raf = 0; fn(); });
  }

  function boot() {
    initPrefs();
    readColours();

    heroCompute();
    t1Reset();
    t2Compute();
    t3Compute();

    /* ---- top bar ---- */
    $('#langBtn').addEventListener('click', () => {
      LANG = LANG === 'zh' ? 'en' : 'zh';
      save('emd-lang', LANG);
      applyLang();
    });
    $('#themeBtn').addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      save('emd-theme', next);
      readColours();
      $('#themeBtn').textContent = next === 'dark' ? S.themeBtn : S.themeBtnDark;
      drawHero();
      redrawActive();
    });
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: light)');
      const onScheme = () => {
        if (document.documentElement.hasAttribute('data-theme')) return;
        readColours();
        $('#themeBtn').textContent = currentTheme() === 'dark' ? S.themeBtn : S.themeBtnDark;
        drawHero(); redrawActive();
      };
      if (mq.addEventListener) mq.addEventListener('change', onScheme);
      else if (mq.addListener) mq.addListener(onScheme);
    }

    /* ---- tabs ---- */
    $$('.tab').forEach(b => b.addEventListener('click', () => showTab(+b.dataset.tab)));

    /* ---- tab 1 ---- */
    $('#t1Next').addEventListener('click', t1Next);
    $('#t1Reset').addEventListener('click', () => { t1Reset(); render1(); });
    const posInput = $('#t1Pos');
    posInput.max = String(T1.sig.n - 1);
    posInput.value = String(T1.pos);
    posInput.addEventListener('input', () => {
      T1.pos = +posInput.value;
      schedule(render1);
    });

    /* ---- tab 2 ---- */
    $$('#t2Stages .btn').forEach(b => b.addEventListener('click', () => {
      T2.stage = b.dataset.stage;
      t2Compute();
      render2();
    }));
    const noiseInput = $('#t2Noise');
    noiseInput.addEventListener('input', () => {
      T2.noise = +noiseInput.value;
      schedule(() => { t2Compute(); render2(); });
    });

    /* ---- tab 3 ---- */
    const tIn = $('#t3Time'), fIn = $('#t3Freq');
    tIn.addEventListener('input', () => {
      T3.t0 = +tIn.value;
      schedule(() => { t3Compute(); render3(); });
    });
    fIn.addEventListener('input', () => {
      T3.f0 = +fIn.value;
      schedule(() => { t3Compute(); render3(); });
    });

    /* ---- resize ---- */
    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { drawHero(); redrawActive(); }, 120);
    });

    applyLang();
    showTab(1);
    drawHero();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();

</script>
</body>
</html>
