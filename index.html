<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMD — 互動式睡眠訊號分解</title>
<meta name="description" content="An interactive page on Empirical Mode Decomposition and the Hilbert spectrum, and what they mean for sleep research. Every curve is computed in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101820'/><path d='M2 16 q4 -9 8 0 t8 0 t8 0 t8 0' fill='none' stroke='%23E8D5A8' stroke-width='2'/></svg>">
<style>
/* ===== Overnight Recording — visual system =====================
   Cool background, warm signal trace: the curve should read like
   a lit pen on dark paper, the way a sleep lab looks at 3 a.m.  */

:root {
  --night:    #101820;
  --panel:    #18222C;
  --haze:     #243140;
  --text:     #DCE4EA;
  --text-dim: #8C9AA8;
  --trace:    #E8D5A8;
  --coral:    #E0705E;
  --cyan:     #5AB6C4;
  --sage:     #8FBF7F;
  --violet:   #9B8CC4;
  --shadow:   rgba(0,0,0,.35);

  --serif: "Fraunces", "Newsreader", Georgia, "Noto Serif TC", serif;
  --sans:  "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:  "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --measure: 68ch;
  --wrap: 1100px;
  --radius: 3px;
}

:root[data-theme="light"] {
  --night:    #EDF0F3;
  --panel:    #FBFCFD;
  --haze:     #CBD5DE;
  --text:     #16202A;
  --text-dim: #5C6B79;
  --trace:    #8A6520;
  --coral:    #BE4432;
  --cyan:     #1C6B78;
  --sage:     #3F7A31;
  --violet:   #5D4E93;
  --shadow:   rgba(16,24,32,.10);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --night:    #EDF0F3;
    --panel:    #FBFCFD;
    --haze:     #CBD5DE;
    --text:     #16202A;
    --text-dim: #5C6B79;
    --trace:    #8A6520;
    --coral:    #BE4432;
    --cyan:     #1C6B78;
    --sage:     #3F7A31;
    --violet:   #5D4E93;
    --shadow:   rgba(16,24,32,.10);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

p, li { max-width: var(--measure); }

a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent); }
a:hover { border-bottom-color: var(--cyan); }

h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
h2 { font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2rem); margin: 0 0 .6rem; }
h3 { font-size: 1.15rem; margin: 2rem 0 .5rem; }

.num, td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--night) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--haze);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { font-family: var(--serif); font-size: 1rem; letter-spacing: .02em; margin-right: auto; }
.brand span { color: var(--text-dim); font-family: var(--sans); font-size: .8rem; margin-left: .6rem; }

.ghost {
  appearance: none; background: none; cursor: pointer;
  border: 1px solid var(--haze); border-radius: var(--radius);
  color: var(--text-dim); font: 500 .8rem/1 var(--sans);
  padding: 7px 11px; letter-spacing: .03em;
}
.ghost:hover { color: var(--text); border-color: var(--text-dim); }
.ghost:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- hero ---------- */
.hero { padding: 64px 0 40px; border-bottom: 1px solid var(--haze); }
.hero h1 { font-size: clamp(2rem, 1.3rem + 3vw, 3.2rem); margin: 0 0 1rem; max-width: 20ch; }
.hero .lede { color: var(--text-dim); font-size: 1.05rem; max-width: 60ch; }
.hero-strip { margin-top: 36px; }
.hero-strip canvas { width: 100%; height: 300px; display: block; }
.strip-cap {
  display: flex; justify-content: space-between; gap: 16px;
  color: var(--text-dim); font: 400 .78rem/1.5 var(--mono);
  border-top: 1px solid var(--haze); padding-top: 8px; margin-top: 6px;
}

/* ---------- sections ---------- */
section { padding: 56px 0; border-bottom: 1px solid var(--haze); }
.eyebrow {
  font: 500 .72rem/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-dim); margin: 0 0 .9rem;
}

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--haze); margin: 8px 0 28px; flex-wrap: wrap; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  color: var(--text-dim); font: 500 .95rem/1 var(--sans);
  padding: 0 0 12px; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--trace); }
.tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.panel[hidden] { display: none; }

/* ---------- controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.btn {
  appearance: none; cursor: pointer; border-radius: var(--radius);
  border: 1px solid var(--haze); background: var(--panel); color: var(--text);
  font: 500 .88rem/1 var(--sans); padding: 10px 16px;
}
.btn:hover { border-color: var(--text-dim); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: var(--trace); border-color: var(--trace); color: #1A130B; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--trace); color: var(--trace); }

.slider { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 230px; }
.slider label { color: var(--text-dim); font-size: .85rem; white-space: nowrap; }
.slider output { font-family: var(--mono); font-size: .85rem; min-width: 7ch; text-align: right; }
input[type="range"] {
  appearance: none; flex: 1; height: 2px; background: var(--haze); border-radius: 2px; margin: 0;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--trace); border: 0; cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%; background: var(--trace); border: 0; cursor: pointer;
}
input[type="range"]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }

/* ---------- plots ---------- */
.plot { background: var(--panel); border: 1px solid var(--haze); border-radius: var(--radius); padding: 10px 12px 6px; }
.plot + .plot { margin-top: 14px; }
.plot canvas { width: 100%; display: block; }
.plot-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font: 500 .78rem/1.4 var(--mono); color: var(--text-dim); margin-bottom: 6px;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0; font: 400 .76rem/1.6 var(--mono); color: var(--text-dim); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 7px; }
.legend .dot { width: 7px; height: 7px; border-radius: 50%; }

.stepline { font: 400 .8rem/1.5 var(--mono); color: var(--text-dim); margin: 0 0 14px; }
.stepline b { color: var(--text); font-weight: 600; }

/* ---------- condition report ---------- */
.checks { display: grid; gap: 10px; margin-top: 16px; }
.check {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline;
  border: 1px solid var(--haze); border-left-width: 3px; border-radius: var(--radius);
  background: var(--panel); padding: 12px 14px; font-size: .88rem;
}
.check .tag { font: 600 .74rem/1 var(--mono); letter-spacing: .08em; color: var(--text-dim); }
.check .val { font-family: var(--mono); font-size: .84rem; color: var(--text-dim); white-space: nowrap; }
.check.ok   { border-left-color: var(--sage); }
.check.no   { border-left-color: var(--coral); }
.check.ok .val { color: var(--sage); }
.check.no .val { color: var(--coral); }
.verdict { margin-top: 14px; font-family: var(--mono); font-size: .86rem; }
.verdict.ok { color: var(--sage); }
.verdict.no { color: var(--coral); }

/* ---------- table ---------- */
.tablewrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--haze); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: .8rem; }
th, td { padding: 7px 12px; text-align: right; white-space: nowrap; }
th {
  background: var(--panel); color: var(--text-dim); font-weight: 500;
  border-bottom: 1px solid var(--haze); position: sticky; top: 0;
  font-size: .74rem; letter-spacing: .04em;
}
td { border-bottom: 1px solid color-mix(in srgb, var(--haze) 45%, transparent); color: var(--text-dim); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.focus td { background: color-mix(in srgb, var(--trace) 9%, transparent); color: var(--text); }
th:first-child, td:first-child { text-align: left; }
.c-trace { color: var(--trace) !important; }
.c-cyan  { color: var(--cyan) !important; }
.c-sage  { color: var(--sage) !important; }

/* ---------- stage buttons / imf list ---------- */
.stages { display: flex; flex-wrap: wrap; gap: 8px; }
.imf-rows { margin-top: 14px; display: grid; gap: 0; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

.readout {
  margin-top: 16px; border: 1px solid var(--haze); border-radius: var(--radius);
  background: var(--panel); padding: 14px 16px;
  font-family: var(--mono); font-size: .84rem; color: var(--text-dim);
  display: grid; gap: 6px;
}
.readout b { color: var(--text); font-weight: 600; }
.readout .hi { color: var(--trace); }

.note {
  border-left: 2px solid var(--haze); padding: 2px 0 2px 16px;
  color: var(--text-dim); font-size: .92rem; margin: 20px 0 0; max-width: var(--measure);
}

/* ---------- references ---------- */
.refs { display: grid; gap: 22px; margin-top: 8px; }
.ref { display: grid; grid-template-columns: 3.2rem 1fr; gap: 16px; max-width: 76ch; }
.ref .n { font: 500 .8rem/1.8 var(--mono); color: var(--trace); }
.ref p { margin: 0; font-size: .92rem; }
.ref .meta { color: var(--text-dim); font-size: .84rem; margin-top: 2px; }
.ref .gloss { color: var(--text-dim); font-size: .86rem; margin-top: .5rem; border-left: 2px solid var(--haze); padding-left: 14px; }
.ref-group { font: 500 .72rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin: 34px 0 6px; }

footer { padding: 40px 0 64px; color: var(--text-dim); font-size: .85rem; }
footer p { max-width: var(--measure); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.cols h3 { margin-top: 0; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .hero { padding: 40px 0 28px; }
  .hero-strip canvas { height: 220px; }
  section { padding: 40px 0; }
  .tabs { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- stacked IMF rows (tab 2 and the hero strip) ---------- */
.imf-row {
  display: grid; grid-template-columns: 172px 1fr; gap: 14px; align-items: center;
  border-top: 1px solid color-mix(in srgb, var(--haze) 60%, transparent);
  padding: 2px 0;
}
.imf-row:first-child { border-top: 0; }
.imf-row canvas { width: 100%; display: block; }
.imf-meta { font: 400 .76rem/1.45 var(--mono); color: var(--text-dim); padding: 6px 0; }
.imf-meta b { display: block; color: var(--text); font-weight: 600; letter-spacing: .02em; }
.imf-meta .band { color: var(--cyan); }
.imf-row.is-signal .imf-meta b { color: var(--trace); }
@media (max-width: 560px) {
  .imf-row { grid-template-columns: 1fr; gap: 0; }
  .imf-meta { padding: 6px 0 0; }
}

.stage-desc { color: var(--text-dim); font-size: .92rem; margin: 14px 0 4px; max-width: var(--measure); }
.axis-note { font: 400 .72rem/1.4 var(--mono); color: var(--text-dim); text-align: right; margin-top: 6px; }

.plot.is-waiting canvas { opacity: .2; }
.plot.is-waiting .plot-head { opacity: .6; }
#implList { padding-left: 0; list-style: none; }
#implList li { margin-bottom: .5rem; max-width: var(--measure); font-size: .92rem; color: var(--text-dim); }
#implList code { color: var(--trace); font-size: .86rem; }
.hero-strip .plot-head { margin-bottom: 8px; }

.ctl-label { color: var(--text-dim); font-size: .85rem; margin-right: 2px; }
.hint { color: var(--text-dim); font-size: .76rem; }

/* ---------- chapter 04: component sliders ---------- */
.comp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 26px; margin: 4px 0 6px; }
@media (max-width: 760px) { .comp-grid { grid-template-columns: 1fr; } }
.comp { border-top: 1px solid var(--haze); padding-top: 10px; }
.comp .slider { margin-bottom: 8px; }
.comp .slider label { min-width: 4.5em; }
.comp-name { font: 600 .78rem/1 var(--mono); letter-spacing: .06em; color: var(--trace); margin: 0 0 10px; }

/* ---------- chapter 08: paper cards ---------- */
.papers { display: grid; gap: 10px; margin: 18px 0 8px; }
.paper { border: 1px solid var(--haze); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.paper.is-open { border-color: color-mix(in srgb, var(--trace) 45%, var(--haze)); }
.paper-head {
  appearance: none; width: 100%; background: none; border: 0; cursor: pointer; text-align: left;
  display: grid; grid-template-columns: 3rem 1fr 1.6rem; gap: 12px; align-items: center;
  padding: 14px 16px; color: inherit; font: inherit;
}
.paper-head:hover { background: color-mix(in srgb, var(--haze) 30%, transparent); }
.paper-head:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
.paper-head .n { font: 500 .8rem/1 var(--mono); color: var(--trace); }
.paper-head .ph b { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 2px; }
.paper-head .cite { color: var(--text-dim); font-size: .8rem; }
.paper-head .tog { font: 400 1.1rem/1 var(--mono); color: var(--text-dim); text-align: right; }
.paper-body { padding: 0 16px 16px; border-top: 1px solid var(--haze); }
.paper-body dl { display: grid; grid-template-columns: 4.5rem 1fr; gap: 6px 16px; margin: 14px 0 0; }
.paper-body dt { font: 500 .74rem/1.6 var(--mono); letter-spacing: .06em; color: var(--text-dim); }
.paper-body dd { margin: 0; font-size: .9rem; max-width: 66ch; }
.paper-body .meta { color: var(--text-dim); font-size: .82rem; margin: 14px 0 0; }
@media (max-width: 560px) {
  .paper-head { grid-template-columns: 2.4rem 1fr 1.2rem; gap: 8px; padding: 12px; }
  .paper-body dl { grid-template-columns: 1fr; gap: 2px; }
  .paper-body dd { margin-bottom: 8px; }
}

@media (max-width: 620px) {
  /* long control labels must be allowed to wrap, or they push the page wider */
  .slider { flex-wrap: wrap; row-gap: 4px; }
  .slider label { white-space: normal; flex: 1 0 100%; }
  .slider output { min-width: 5ch; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span data-i18n="brand">經驗模態分解</span><span data-i18n="brandSub">整夜記錄</span></div>
    <button class="ghost" id="langBtn" type="button">EN</button>
    <button class="ghost" id="themeBtn" type="button">明亮</button>
  </div>
</header>

<main>

  <div class="wrap hero">
    <h1 data-i18n="heroTitle">把一夜的腦波，拆成它自己的節奏</h1>
    <p class="lede" data-i18n="heroLede"></p>
    <div class="hero-strip">
      <canvas id="heroCanvas" aria-hidden="true"></canvas>
      <div class="strip-cap">
        <span data-i18n="stripLeft"></span>
        <span data-i18n="stripRight"></span>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <p class="eyebrow" data-i18n="introEyebrow">起點</p>
      <h2 data-i18n="introTitle"></h2>
      <p data-i18n="introP1"></p>
      <p data-i18n="introP2"></p>
      <p data-i18n="introP3"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="ext" aria-selected="false">01 局部極值</button>
        <button class="tab" role="tab" type="button" data-tab="env" aria-selected="false">02 包絡線與端點</button>
        <button class="tab" role="tab" type="button" data-tab="sift" aria-selected="true">03 篩選演算法</button>
        <button class="tab" role="tab" type="button" data-tab="lab" aria-selected="false">04 訊號實驗室</button>
        <button class="tab" role="tab" type="button" data-tab="stage" aria-selected="false">05 五個睡眠期</button>
        <button class="tab" role="tab" type="button" data-tab="spec" aria-selected="false">06 傅立葉 vs 希爾伯特</button>
        <button class="tab" role="tab" type="button" data-tab="mix" aria-selected="false">07 模態混合與 EEMD</button>
        <button class="tab" role="tab" type="button" data-tab="paper" aria-selected="false">08 論文案例</button>
      </div>


      <!-- ===== 01 local extrema ===== -->
      <div class="panel" role="tabpanel" data-tab="ext" hidden>
        <h2 data-i18n="exTitle"></h2>
        <p data-i18n="exIntro"></p>
        <div class="controls">
          <div class="slider">
            <label for="xFreq" data-i18n="exFreq"></label>
            <input type="range" id="xFreq" min="1" max="20" step="0.5" value="7">
            <output id="xFreqOut" for="xFreq"></output>
          </div>
          <div class="slider">
            <label for="xAmp" data-i18n="exAmp"></label>
            <input type="range" id="xAmp" min="0" max="6" step="0.1" value="2.5">
            <output id="xAmpOut" for="xAmp"></output>
          </div>
        </div>
        <div class="plot">
          <div class="plot-head"><span class="mono">fs = 64 Hz · N = 256 · t (s)</span></div>
          <canvas id="xMain"></canvas>
        </div>
        <div class="controls">
          <div class="slider">
            <label for="xPos" data-i18n="exPos"></label>
            <input type="range" id="xPos" min="1" max="254" step="1" value="96">
            <output id="xPosOut" for="xPos"></output>
          </div>
          <span class="hint mono" data-i18n="exClick"></span>
        </div>
        <div class="checks" id="xPanel"></div>
        <div class="readout" id="xCounts"></div>
        <p class="note" data-i18n="exNote"></p>
      </div>

      <!-- ===== 02 envelopes and ends ===== -->
      <div class="panel" role="tabpanel" data-tab="env" hidden>
        <h2 data-i18n="envTitle"></h2>
        <p data-i18n="envIntro"></p>
        <div class="controls">
          <span class="ctl-label" data-i18n="envMode"></span>
          <div class="stages" id="eModes">
            <button class="btn" type="button" data-mode="none"></button>
            <button class="btn" type="button" data-mode="linear"></button>
            <button class="btn" type="button" data-mode="mirror"></button>
          </div>
        </div>
        <div class="controls">
          <div class="slider">
            <label for="eCut" data-i18n="envCut"></label>
            <input type="range" id="eCut" min="600" max="1024" step="8" value="1008">
            <output id="eCutOut" for="eCut"></output>
          </div>
        </div>
        <p class="stage-desc" id="eModeDesc"></p>
        <div class="plot">
          <div class="plot-head"><span class="mono">fs = 100 Hz · t (s)</span></div>
          <canvas id="eMain"></canvas>
          <div class="legend" id="eLegend"></div>
        </div>
        <div class="readout" id="eReadout"></div>
        <p class="note" data-i18n="envNote"></p>
      </div>

      <!-- ===== 03 the sifting algorithm ===== -->
      <div class="panel" role="tabpanel" data-tab="sift" hidden>
        <h2 data-i18n="p1Title"></h2>
        <p data-i18n="p1Intro"></p>

<script>
/* ============================================================
   emd.core.js — Empirical Mode Decomposition / Hilbert-Huang
   Pure vanilla JavaScript. No dependencies.
   Huang et al. (1998), Proc. R. Soc. Lond. A 454, 903-995.
   ============================================================ */
'use strict';
(function (global) {

  /* ---------- 1. natural cubic spline ------------------------
     Solves the tridiagonal system for the second derivatives
     (natural boundary: m[0] = m[n-1] = 0) with the Thomas
     algorithm, then evaluates the piecewise cubic at xq.
     xs must be strictly increasing; xq is assumed ascending
     (a moving interval pointer keeps evaluation O(n+m)).      */
  function cubicSpline(xs, ys, xq) {
    const n = xs.length;
    const out = new Float64Array(xq.length);
    if (n === 0) return out;
    if (n === 1) { out.fill(ys[0]); return out; }
    if (n === 2) {
      const k = (ys[1] - ys[0]) / (xs[1] - xs[0]);
      for (let i = 0; i < xq.length; i++) out[i] = ys[0] + k * (xq[i] - xs[0]);
      return out;
    }

    const h = new Float64Array(n - 1);
    for (let i = 0; i < n - 1; i++) h[i] = xs[i + 1] - xs[i];

    const sub = new Float64Array(n), diag = new Float64Array(n),
          sup = new Float64Array(n), rhs = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) {
      sub[i]  = h[i - 1];
      diag[i] = 2 * (h[i - 1] + h[i]);
      sup[i]  = h[i];
      rhs[i]  = 6 * ((ys[i + 1] - ys[i]) / h[i] - (ys[i] - ys[i - 1]) / h[i - 1]);
    }

    const cp = new Float64Array(n), dp = new Float64Array(n), m = new Float64Array(n);
    cp[1] = sup[1] / diag[1];
    dp[1] = rhs[1] / diag[1];
    for (let i = 2; i < n - 1; i++) {
      const den = diag[i] - sub[i] * cp[i - 1];
      cp[i] = sup[i] / den;
      dp[i] = (rhs[i] - sub[i] * dp[i - 1]) / den;
    }
    m[n - 2] = dp[n - 2];
    for (let i = n - 3; i >= 1; i--) m[i] = dp[i] - cp[i] * m[i + 1];

    let j = 0;
    for (let q = 0; q < xq.length; q++) {
      const x = xq[q];
      while (j < n - 2 && x > xs[j + 1]) j++;
      while (j > 0 && x < xs[j]) j--;
      const hj = h[j];
      const A = (xs[j + 1] - x) / hj, B = (x - xs[j]) / hj;
      out[q] = A * ys[j] + B * ys[j + 1] +
               ((A * A * A - A) * m[j] + (B * B * B - B) * m[j + 1]) * hj * hj / 6;
    }
    return out;
  }

  /* ---------- 2. local extrema -------------------------------
     Plateaux are collapsed to their centre so that a flat top
     yields exactly one maximum.                                */
  function findExtrema(y) {
    const maxI = [], minI = [], n = y.length;
    for (let i = 1; i < n - 1; i++) {
      if (y[i] > y[i - 1] && y[i] >= y[i + 1]) {
        if (y[i] === y[i + 1]) {
          let k = i + 1;
          while (k < n - 1 && y[k] === y[i]) k++;
          if (y[k] < y[i]) maxI.push((i + k - 1) >> 1);
          i = k - 1;
        } else maxI.push(i);
      } else if (y[i] < y[i - 1] && y[i] <= y[i + 1]) {
        if (y[i] === y[i + 1]) {
          let k = i + 1;
          while (k < n - 1 && y[k] === y[i]) k++;
          if (y[k] > y[i]) minI.push((i + k - 1) >> 1);
          i = k - 1;
        } else minI.push(i);
      }
    }
    return { maxI, minI };
  }

  /* ---------- 3. envelopes -----------------------------------
     The two envelopes are cubic splines through the maxima and
     through the minima.  Both ends are mirrored (Rilling's
     boundary conditions): the extrema near an edge are reflected
     about the outermost extremum -- or about the edge sample
     itself when the signal already overshoots that extremum --
     so the spline interpolates across [0, n-1] instead of
     extrapolating.  Skipping this makes the first and last ~10%
     of every envelope visibly wrong: the classic "end effect".  */
  const N_MIRROR = 2;
  const CFG = { boundary: 'linear' };   /* 'linear' | 'mirror' | 'none' */

  function takeRev(arr, from, count) {
    const out = [];
    for (let i = Math.min(from + count, arr.length) - 1; i >= from; i--) out.push(arr[i]);
    return out;                       /* descending order */
  }
  function takeRevEnd(arr, skipFromEnd, count) {
    const last = arr.length - 1 - skipFromEnd;
    const out = [];
    for (let i = last; i > last - count && i >= 0; i--) out.push(arr[i]);
    return out;                       /* descending order */
  }

  /* Returns mirrored knot sets for both envelopes at once. */
  function extendExtrema(y, maxI, minI) {
    const n = y.length, lx = n - 1, nb = N_MIRROR;
    let lmax, lmin, lsym, rmax, rmin, rsym;

    /* ----- left edge ----- */
    if (maxI[0] < minI[0]) {
      if (y[0] > y[minI[0]]) {
        lmax = takeRev(maxI, 1, nb); lmin = takeRev(minI, 0, nb); lsym = maxI[0];
      } else {
        lmax = takeRev(maxI, 0, nb); lmin = takeRev(minI, 0, nb - 1).concat([0]); lsym = 0;
      }
    } else {
      if (y[0] < y[maxI[0]]) {
        lmax = takeRev(maxI, 0, nb); lmin = takeRev(minI, 1, nb); lsym = minI[0];
      } else {
        lmax = takeRev(maxI, 0, nb - 1).concat([0]); lmin = takeRev(minI, 0, nb); lsym = 0;
      }
    }

    /* ----- right edge ----- */
    if (maxI[maxI.length - 1] < minI[minI.length - 1]) {
      if (y[lx] < y[maxI[maxI.length - 1]]) {
        rmax = takeRevEnd(maxI, 0, nb); rmin = takeRevEnd(minI, 1, nb); rsym = minI[minI.length - 1];
      } else {
        rmax = [lx].concat(takeRevEnd(maxI, 0, nb - 1)); rmin = takeRevEnd(minI, 0, nb); rsym = lx;
      }
    } else {
      if (y[lx] > y[minI[minI.length - 1]]) {
        rmax = takeRevEnd(maxI, 1, nb); rmin = takeRevEnd(minI, 0, nb); rsym = maxI[maxI.length - 1];
      } else {
        rmax = takeRevEnd(maxI, 0, nb); rmin = [lx].concat(takeRevEnd(minI, 0, nb - 1)); rsym = lx;
      }
    }

    function build(mirrorL, core, mirrorR) {
      const xs = [], ys = [];
      for (let i = mirrorL.length - 1; i >= 0; i--) {      /* ascending */
        xs.push(2 * lsym - mirrorL[i]); ys.push(y[mirrorL[i]]);
      }
      for (let i = 0; i < core.length; i++) { xs.push(core[i]); ys.push(y[core[i]]); }
      for (let i = 0; i < mirrorR.length; i++) {
        xs.push(2 * rsym - mirrorR[i]); ys.push(y[mirrorR[i]]);
      }
      /* strictly increasing abscissae */
      const X = [], Y = [];
      for (let i = 0; i < xs.length; i++) {
        if (!X.length || xs[i] > X[X.length - 1]) { X.push(xs[i]); Y.push(ys[i]); }
      }
      /* guarantee the knots span [0, n-1]: if the mirror did not
         reach past an edge, reflect the outermost knot about it */
      if (X[0] > 0) {
        const s = X.length > 1 ? (Y[1] - Y[0]) / (X[1] - X[0]) : 0;
        X.unshift(-X[0]); Y.unshift(Y[0] - s * (X[1] - X[0]) * 2);
      }
      if (X[X.length - 1] < lx) {
        const m = X.length;
        const s = m > 1 ? (Y[m - 1] - Y[m - 2]) / (X[m - 1] - X[m - 2]) : 0;
        const d = lx - X[m - 1];
        X.push(lx + d); Y.push(Y[m - 1] + s * 2 * d);
      }
      return { X, Y };
    }

    return {
      up: build(lmax, maxI, rmax),
      lo: build(lmin, minI, rmin)
    };
  }

  function splineAt(knots, n) {
    const xq = new Float64Array(n);
    for (let i = 0; i < n; i++) xq[i] = i;
    return cubicSpline(knots.X, knots.Y, xq);
  }

  /* Alternative boundary treatment: linear extrapolation from
     the two outermost extrema of the same kind, clamped so the
     envelope neither crosses the signal at the edge nor leaves
     the global range.  Kept switchable because the two schemes
     trade off differently (see test/compare-boundary.js).      */
  function extendLinear(y, idx, isUpper) {
    const n = y.length;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < n; i++) { if (y[i] < minY) minY = y[i]; if (y[i] > maxY) maxY = y[i]; }
    const X = [], Y = [];
    if (idx[0] !== 0) {
      let v;
      if (idx.length >= 2) {
        const sl = (y[idx[1]] - y[idx[0]]) / (idx[1] - idx[0]);
        v = y[idx[0]] - sl * idx[0];
      } else v = y[idx[0]];
      v = isUpper ? Math.min(Math.max(v, y[0]), maxY) : Math.max(Math.min(v, y[0]), minY);
      X.push(0); Y.push(v);
    }
    for (let i = 0; i < idx.length; i++) { X.push(idx[i]); Y.push(y[idx[i]]); }
    const last = idx[idx.length - 1];
    if (last !== n - 1) {
      let v;
      if (idx.length >= 2) {
        const p = idx[idx.length - 2];
        const sl = (y[last] - y[p]) / (last - p);
        v = y[last] + sl * (n - 1 - last);
      } else v = y[last];
      v = isUpper ? Math.min(Math.max(v, y[n - 1]), maxY) : Math.max(Math.min(v, y[n - 1]), minY);
      X.push(n - 1); Y.push(v);
    }
    return { X, Y };
  }

  /* Both envelopes in one call (what the sifting loop uses). */
  function envelopes(y, maxI, minI) {
    const n = y.length;
    if (maxI.length === 0 || minI.length === 0 || maxI.length + minI.length < 3) {
      const flat = new Float64Array(n), flat2 = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        flat[i] = y[0] + (y[n - 1] - y[0]) * i / (n - 1);
        flat2[i] = flat[i];
      }
      return { up: flat, lo: flat2 };
    }
    if (CFG.boundary === 'none') {
      /* no boundary treatment at all: the spline is built from the
         extrema alone, so beyond the outermost ones it extrapolates
         freely. Kept so the end effect can be shown rather than
         merely described. */
      const kx = { X: [], Y: [] }, kn = { X: [], Y: [] };
      for (let i = 0; i < maxI.length; i++) { kx.X.push(maxI[i]); kx.Y.push(y[maxI[i]]); }
      for (let i = 0; i < minI.length; i++) { kn.X.push(minI[i]); kn.Y.push(y[minI[i]]); }
      return { up: splineAt(kx, n), lo: splineAt(kn, n) };
    }
    if (CFG.boundary === 'linear') {
      return {
        up: splineAt(extendLinear(y, maxI, true), n),
        lo: splineAt(extendLinear(y, minI, false), n)
      };
    }
    const k = extendExtrema(y, maxI, minI);
    return { up: splineAt(k.up, n), lo: splineAt(k.lo, n) };
  }

  /* Public single-envelope helper, kept for the API in the spec.
     isUpper is optional; when omitted it is inferred from the
     mean level of the given extrema.                           */
  function envelope(y, idx, isUpper) {
    const ex = findExtrema(y);
    if (isUpper === undefined) {
      let sExt = 0, sAll = 0;
      for (let i = 0; i < idx.length; i++) sExt += y[idx[i]];
      for (let i = 0; i < y.length; i++) sAll += y[i];
      isUpper = (idx.length ? sExt / idx.length : 0) >= sAll / y.length;
    }
    const e = envelopes(y, isUpper ? idx : ex.maxI, isUpper ? ex.minI : idx);

  /* ---------- 4. one sifting pass ---------------------------- */
  function siftOnce(h) {
    const { maxI, minI } = findExtrema(h);
    const e = envelopes(h, maxI, minI);
    const up = e.up, lo = e.lo;
    const n = h.length;
    const mean = new Float64Array(n), hNew = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      mean[i] = (up[i] + lo[i]) / 2;
      hNew[i] = h[i] - mean[i];
    }
    return { up, lo, mean, hNew, maxI, minI };
  }

  /* ---------- zero crossings --------------------------------- */
  function countZeroCrossings(y) {
    let c = 0;
    for (let i = 1; i < y.length; i++) {
      if ((y[i - 1] < 0 && y[i] > 0) || (y[i - 1] > 0 && y[i] < 0)) c++;

        let k = i + 1;
        while (k < y.length && y[k] === 0) k++;

    const s = siftOnce(h);

    const nExt = s.maxI.length + s.minI.length;
    const nZero = countZeroCrossings(h);
    const c1 = Math.abs(nExt - nZero) <= 1;

    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < n; i++) { if (h[i] < mn) mn = h[i]; if (h[i] > mx) mx = h[i]; }

    let mmax = 0;
    for (let i = 0; i < n; i++) { const a = Math.abs(s.mean[i]); if (a > mmax) mmax = a; }

    const sym = amp > 0 ? mmax / amp : 0;
    const c2 = sym < 0.05;

  const SD_THRESHOLD = 0.2;

  function sift(y) {
    let h = Float64Array.from(y);
    for (let it = 0; it < MAX_SIFT; it++) {
      const s = siftOnce(h);
      if (s.maxI.length + s.minI.length < 3) break;
      let num = 0, den = 0;
      for (let i = 0; i < h.length; i++) {
        const d = h[i] - s.hNew[i];

  /* ---------- 7. EMD ----------------------------------------- */
  function emd(y, maxImf) {
    maxImf = maxImf || 8;

  /* ---------- 7b. EEMD ---------------------------------------
     Ensemble EMD (Wu & Huang 2009). Each ensemble member is the
     signal plus a fresh realisation of finite-amplitude white
     noise; the members are decomposed independently and the
     IMFs averaged index by index. The noise fills the gaps that
     make an intermittent signal produce mode mixing, and it
     cancels in the average.
     The averaged IMFs no longer sum to the signal exactly, so
     the residue returned here is y - sum(IMFs), which keeps the

    const acc = [];
    for (let k = 0; k < maxImf; k++) acc.push(new Float64Array(n));

    for (let e = 0; e < ensemble; e++) {

    }

    while (imfs.length > 1 && hits[imfs.length - 1] < ensemble * 0.5) imfs.pop();

    const residue = new Float64Array(n);
    for (let i = 0; i < n; i++) {

  }

  /* ---------- 8. FFT (iterative radix-2, in place) ------------ */
  function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

  function fft(re, im) {
    const n = re.length;
    if (n <= 1) return;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len;
      const wr = Math.cos(ang), wi = Math.sin(ang);
      const half = len >> 1;
      for (let i = 0; i < n; i += len) {
        let cwr = 1, cwi = 0;
        for (let k = 0; k < half; k++) {
          const ar = re[i + k], ai = im[i + k];
          const br = re[i + k + half], bi = im[i + k + half];
          const vr = br * cwr - bi * cwi;
          const vi = br * cwi + bi * cwr;
          re[i + k] = ar + vr; im[i + k] = ai + vi;
          re[i + k + half] = ar - vr; im[i + k + half] = ai - vi;
          const nwr = cwr * wr - cwi * wi;
          cwi = cwr * wi + cwi * wr;

        }

  function ifft(re, im) {
    const n = re.length;
    for (let i = 0; i < n; i++) im[i] = -im[i];
    fft(re, im);
    for (let i = 0; i < n; i++) { re[i] /= n; im[i] = -im[i] / n; }
  }

  /* single-sided amplitude spectrum */
  function spectrum(x, fs) {
    const n = x.length, N = nextPow2(n);
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < n; i++) re[i] = x[i];
    fft(re, im);
    const half = (N >> 1) + 1;
    const freq = new Float64Array(half), amp = new Float64Array(half);
    for (let k = 0; k < half; k++) {
      freq[k] = k * fs / N;
      const mag = Math.sqrt(re[k] * re[k] + im[k] * im[k]) / n;
      amp[k] = (k === 0 || k === N >> 1) ? mag : 2 * mag;
    }
    return { freq, amp };
  }

  /* ---------- 9. Hilbert transform ---------------------------
     Analytic signal through the FFT: keep DC and Nyquist,
     double the positive frequencies, zero the negative ones.
     Instantaneous frequency = unwrapped phase difference.      */
  function hilbert(x, fs) {
    const n = x.length, N = nextPow2(n);
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < n; i++) re[i] = x[i];
    fft(re, im);
    const half = N >> 1;
    for (let k = 1; k < half; k++) { re[k] *= 2; im[k] *= 2; }
    for (let k = half + 1; k < N; k++) { re[k] = 0; im[k] = 0; }
    ifft(re, im);

    const amp = new Float64Array(n), phase = new Float64Array(n), freq = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      amp[i] = Math.hypot(re[i], im[i]);
      phase[i] = Math.atan2(im[i], re[i]);
    }
    const TWO_PI = 2 * Math.PI;
    for (let i = 0; i < n - 1; i++) {
      let d = phase[i + 1] - phase[i];
      while (d > Math.PI) d -= TWO_PI;
      while (d < -Math.PI) d += TWO_PI;
      freq[i] = d * fs / TWO_PI;
    }
    freq[n - 1] = n > 1 ? freq[n - 2] : 0;
    return { amp, phase, freq, real: re.subarray(0, n), imag: im.subarray(0, n) };
  }

  /* ---------- helpers used by the UI and the tests ----------- */
  function zeroCrossingFreq(x, fs) {
    return countZeroCrossings(x) * fs / (2 * x.length);
  }

  /* Amplitude-weighted mean instantaneous frequency.
     The zero-crossing rate is fine for a steady oscillation but
     badly biased for an intermittent one: in the quiet stretches
     of a bursty IMF, tiny residual ripple still crosses zero and
     drags the estimate upward (a 12 Hz burst train reads as
     25 Hz). Weighting by a^2 counts a sample only as far as it
     carries energy, which is the physically meaningful measure
     and the one the Hilbert spectrum is built on.              */
  function meanFreq(x, fs) {
    const h = hilbert(x, fs);
    const n = x.length;
    const lo = Math.min(20, Math.floor(n * 0.02));
    let num = 0, den = 0;
    for (let i = lo; i < n - lo; i++) {
      const f = h.freq[i];
      if (!(f > 0) || f > fs / 2) continue;
      const w = h.amp[i] * h.amp[i];
      num += w * f;
      den += w;
    }
    return den > 0 ? num / den : 0;
  }
  function peakAmp(x) {
    let m = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > m) m = a; }
    return m;
  }
  function energy(x) {
    let e = 0;
    for (let i = 0; i < x.length; i++) e += x[i] * x[i];
    return e;
  }

    from = from || 0; to = (to === undefined) ? a.length : to;
    let ma = 0, mb = 0;
    const m = to - from;
    for (let i = from; i < to; i++) { ma += a[i]; mb += b[i]; }
    ma /= m; mb /= m;
    let sab = 0, saa = 0, sbb = 0;
    for (let i = from; i < to; i++) {
      const da = a[i] - ma, db = b[i] - mb;
      sab += da * db; saa += da * da; sbb += db * db;
    }
    return sab / Math.sqrt(saa * sbb);
  }

  /* Hilbert spectrum: max instantaneous amplitude on a
     time x frequency grid, assembled over all IMFs.           */
  function hilbertSpectrum(imfs, fs, opts) {
    const nT = opts.nT, nF = opts.nF, fMax = opts.fMax;
    const sT = opts.spreadT === undefined ? 1 : opts.spreadT;
    const sF = opts.spreadF === undefined ? 1 : opts.spreadF;
    const n = imfs.length ? imfs[0].length : 0;
    const grid = new Float64Array(nT * nF);
    for (let k = 0; k < imfs.length; k++) {
      const h = hilbert(imfs[k], fs);
      for (let i = 0; i < n; i++) {
        const f = h.freq[i];
        if (!(f > 0) || f >= fMax) continue;
        const ti = Math.min(nT - 1, Math.floor(i / n * nT));
        const fi = Math.min(nF - 1, Math.floor(f / fMax * nF));
        /* one sample is one point; smear it over a couple of cells so a
           continuous ridge reads as a ridge instead of scattered dots */
        for (let df = -sF; df <= sF; df++) {
          const y = fi + df;
          if (y < 0 || y >= nF) continue;
          const wf = 1 - 0.45 * Math.abs(df);
          for (let dt = -sT; dt <= sT; dt++) {
            const x = ti + dt;
            if (x < 0 || x >= nT) continue;
            const v = h.amp[i] * wf * (1 - 0.25 * Math.abs(dt));
            const q = y * nT + x;
            if (v > grid[q]) grid[q] = v;
          }
        }
      }
    }
    return { grid, nT, nF, fMax };
  }

  const EMD = {
    cubicSpline, findExtrema, envelope, envelopes, siftOnce, imfCheck, sift, emd, eemd,
    fft, ifft, spectrum, hilbert, hilbertSpectrum,
    countZeroCrossings, zeroCrossingFreq, meanFreq, peakAmp, energy, correlation,

<script>
/* ============================================================
   signals.js — synthetic signals shared by the tests and the UI
   Every waveform is deterministic: the same arguments always
   produce the same samples, so the numbers quoted on the page
   can be reproduced by the Node test suite.
   ============================================================ */
'use strict';
(function (global) {

  /* deterministic PRNG (mulberry32) — no Math.random anywhere */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  /* approximately normal, via the sum of 4 uniforms */
  function gaussNoise(n, sigma, seed) {
    const r = rng(seed), out = new Float64Array(n);
    for (let i = 0; i < n; i++) {

      out[i] = u * sigma * 0.8660254;

  function gauss(t, t0, sd) {

    const t = new Float64Array(n);
    for (let i = 0; i < n; i++) t[i] = i / fs;

  /* ---------- tab 1: the teaching signal ---------------------
     Chosen so the sifting process needs several rounds before
     both IMF conditions hold — otherwise the demo would pass
     on round 1 and show nothing.                              */
  function teachingSignal() {
    const fs = 64, n = 256;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      y[i] = 3 * Math.sin(2 * Math.PI * 1.75 * ti)
           + 2.2 * Math.sin(2 * Math.PI * 0.8 * ti + 1)
           + 5 * Math.sin(Math.PI * ti / 4);
    }
    return { t, y, fs, n };
  }

  /* ---------- tab 2: five sleep stages ----------------------- */
  const SLEEP_FS = 100, SLEEP_N = 1024;

  function sleepSignal(stage, noiseLevel) {
    const fs = SLEEP_FS, n = SLEEP_N;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    const dur = n / fs;

    for (let i = 0; i < n; i++) {
      const ti = t[i];
      let v = 0;

      switch (stage) {
        case 'wake': {
          /* 8-13 Hz alpha with slow amplitude modulation
             (alpha bursts), plus ~19 Hz beta. Low voltage. */
          const burst = 0.55 + 0.45 * Math.sin(2 * Math.PI * 0.35 * ti - 0.6);
          v += 24 * burst * Math.sin(2 * Math.PI * 10.2 * ti);
          v += 6 * Math.sin(2 * Math.PI * 11.8 * ti + 2.1);
          v += 3.5 * Math.sin(2 * Math.PI * 19.3 * ti + 0.8);
          v += 5 * Math.sin(2 * Math.PI * 2.2 * ti + 1.4);
          break;
        }

          const fade = Math.exp(-ti / 3.2);
          v += 34 * Math.sin(2 * Math.PI * 6.0 * ti);
          v += 26 * fade * Math.sin(2 * Math.PI * 9.8 * ti + 0.5);
          v += 10 * Math.sin(2 * Math.PI * 3.1 * ti + 2.4);
          v += 3 * Math.sin(2 * Math.PI * 16.0 * ti + 1.1);
          break;

          v += 20 * Math.sin(2 * Math.PI * 1.1 * ti + 0.4);
          v += 7 * Math.sin(2 * Math.PI * 4.4 * ti + 1.9);
          v += 36 * gauss(ti, 2.3, 0.45) * Math.sin(2 * Math.PI * 13.1 * (ti - 2.3));
          v += 32 * gauss(ti, 7.4, 0.45) * Math.sin(2 * Math.PI * 12.7 * (ti - 7.4));
          /* K-complex: sharp negative deflection then a slower
             positive one */
          const kt = 5.0;
          v += -85 * gauss(ti, kt, 0.13);
          v += 55 * gauss(ti, kt + 0.34, 0.26);
          break;

        case 'n3': {

          v += 95 * Math.sin(2 * Math.PI * 0.8 * ti);
          v += 32 * Math.sin(2 * Math.PI * 1.7 * ti + 1.0);
          v += 22 * Math.sin(2 * Math.PI * 0.45 * ti + 2.6);
          v += 7 * Math.sin(2 * Math.PI * 5.5 * ti + 0.3);
          v += 3 * Math.sin(2 * Math.PI * 11.0 * ti + 1.7);
          break;

          v += 24 * Math.sin(2 * Math.PI * 5.6 * ti);
          v += 10 * Math.sin(2 * Math.PI * 7.4 * ti + 1.3);
          /* sawtooth train in the middle of the epoch */
          const win = gauss(ti, dur * 0.52, 1.5);
          const ph = (2.6 * ti) % 1;
          v += 26 * win * (2 * ph - 1);
          v += 3 * Math.sin(2 * Math.PI * 15.5 * ti + 0.9);
          break;
        }
      }
      y[i] = v;
    }

    if (noiseLevel > 0) {
      const nz = gaussNoise(n, noiseLevel, 20260923);
      for (let i = 0; i < n; i++) y[i] += nz[i];
    }
    return { t, y, fs, n };
  }

  const SLEEP_STAGES = ['wake', 'n1', 'n2', 'n3', 'rem'];

  /* ---------- tab 3: one spindle on a slow background --------- */
  function spindleSignal(t0, f0) {
    const fs = SLEEP_FS, n = SLEEP_N;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    const nz = gaussNoise(n, 0.25, 777);
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      let v = 0;
      v += 9 * Math.sin(2 * Math.PI * 0.8 * ti + 0.3);
      v += 4.5 * Math.sin(2 * Math.PI * 3.6 * ti + 1.7);
      v += 26 * gauss(ti, t0, 0.42) * Math.sin(2 * Math.PI * f0 * (ti - t0));

  /* ---------- mode mixing demo -------------------------------
     A slow carrier plus a fast burst that is only present part
     of the time. Intermittency is exactly what makes the sifting

  function mixingSignal(nBursts, burstFreq) {
    const fs = SLEEP_FS, n = SLEEP_N;
    nBursts = nBursts === undefined ? 3 : nBursts;
    burstFreq = burstFreq === undefined ? 12 : burstFreq;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    const slow = new Float64Array(n), fast = new Float64Array(n);
    const dur = n / fs;
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      slow[i] = 5 * Math.sin(2 * Math.PI * 1.0 * ti);
      let b = 0;
      for (let k = 0; k < nBursts; k++) {
        const c = dur * (k + 0.5) / nBursts;

      fast[i] = 2.2 * Math.min(1, b) * Math.sin(2 * Math.PI * burstFreq * ti);
      y[i] = slow[i] + fast[i];

     repeats sample for sample however irregular its content looks.
     Every continuous component is an integer multiple of 1/period
     (including the slow amplitude modulation, which is a product
     of two harmonics and therefore still harmonic), and the noise
     and the transient graphoelements live inside that one period.
     Only the middle period is displayed, which keeps the visible
     slice clear of the end effects at the buffer edges.
     The point of the events is that the trace should not look the
     same twice as it goes past: slow waves wax and wane, spindles
     and K-complexes arrive and pass.                            */
  const HERO_PERIOD = 8192;                       /* 81.92 s at 100 Hz */

  function heroSignal() {
    const fs = SLEEP_FS, P = HERO_PERIOD, n = P * 3;
    const f0 = fs / P;                            /* 0.012207 Hz */
    const one = new Float64Array(P);
    const nz = gaussNoise(P, 2.2, 7331);

    /* continuous background, every k an integer */
    const slow = [
      { k: 64, a: 74, ph: 0.0 },                  /* 0.781 Hz */
      { k: 136, a: 26, ph: 1.0 },                 /* 1.660 Hz */
      { k: 27, a: 19, ph: 2.6 }                   /* 0.330 Hz */
    ];
    const fast = [
      { k: 451, a: 6, ph: 0.3 },                  /* 5.505 Hz */
      { k: 893, a: 3, ph: 1.7 }                   /* 10.900 Hz */
    ];
    /* the slow band breathes, so the page never looks uniform */
    const breathe = { k: 5, depth: 0.45 };        /* 0.061 Hz, ~16 s */

    /* graphoelements, placed well away from the wrap */
    const spindles = [
      { t: 12.5, f: 13.1, a: 30 },
      { t: 31.0, f: 12.6, a: 26 },
      { t: 58.2, f: 13.4, a: 32 }
    ];
    const kComplexes = [22.0, 47.5, 69.0];

    for (let i = 0; i < P; i++) {
      const ti = i / fs;
      const env = 1 + breathe.depth * Math.sin(2 * Math.PI * breathe.k * f0 * ti);
      let v = 0;
      for (let j = 0; j < slow.length; j++) {
        v += env * slow[j].a * Math.sin(2 * Math.PI * slow[j].k * f0 * ti + slow[j].ph);
      }
      for (let j = 0; j < fast.length; j++) {
        v += fast[j].a * Math.sin(2 * Math.PI * fast[j].k * f0 * ti + fast[j].ph);
      }
      for (let j = 0; j < spindles.length; j++) {
        const sp = spindles[j];
        v += sp.a * gauss(ti, sp.t, 0.42) * Math.sin(2 * Math.PI * sp.f * (ti - sp.t));
      }
      for (let j = 0; j < kComplexes.length; j++) {
        const kt = kComplexes[j];
        v += -70 * gauss(ti, kt, 0.13);
        v += 46 * gauss(ti, kt + 0.34, 0.26);
      }
      one[i] = v + nz[i];
    }

    const t = timeAxis(n, fs), y = new Float64Array(n);
    for (let i = 0; i < n; i++) y[i] = one[i % P];
    return { t, y, fs, n, period: P };
  }

  /* ---------- envelope / end-effect demo ---------------------
     Amplitude rises linearly, so the true upper envelope is
     known in closed form and the error of each boundary rule
     can be measured rather than argued about.                 */
  function amSignal(n) {
    const fs = SLEEP_FS, full = SLEEP_N;
    n = n || full;
    const t = timeAxis(n, fs), y = new Float64Array(n), env = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const ti = t[i];
      const A = 5 * (1 + 0.9 * ti / (full / fs));
      env[i] = A;
      y[i] = A * Math.sin(2 * Math.PI * 0.9 * ti + 0.7);
    }
    return { t, y, env, fs, n };
  }

  /* ---------- tab 4: three sinusoids you can dial ------------ */
  function labSignal(comps, noiseLevel) {
    const fs = SLEEP_FS, n = SLEEP_N;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let v = 0;
      for (let k = 0; k < comps.length; k++) {
        v += comps[k].a * Math.sin(2 * Math.PI * comps[k].f * t[i] + k * 0.7);
      }
      y[i] = v;
    }
    if (noiseLevel > 0) {
      const nz = gaussNoise(n, noiseLevel, 4242);
      for (let i = 0; i < n; i++) y[i] += nz[i];
    }
    return { t, y, fs, n };
  }

  /* ---------- tab 1 of the new chapters: extrema ------------- */
  function extremaSignal(f2, a2) {
    const fs = 64, n = 256;
    const t = timeAxis(n, fs), y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      y[i] = 4 * Math.sin(2 * Math.PI * 1.2 * t[i])
           + a2 * Math.sin(2 * Math.PI * f2 * t[i] + 0.6);
    }
    return { t, y, fs, n };
  }

  /* ---------- test signal of section 5 ----------------------- */
  function testSignal() {
    const fs = 100, n = 1024;
    const t = timeAxis(n, fs);
    const y = new Float64Array(n), fast = new Float64Array(n), slow = new Float64Array(n);
    for (let i = 0; i < n; i++) {

      slow[i] = 5 * Math.sin(2 * Math.PI * 1.5 * t[i]);
      y[i] = fast[i] + slow[i];
    }
    return { t, y, fast, slow, fs, n };
  }

  /* ---------- EEG frequency bands ----------------------------- */
  const BANDS = [
    { key: 'delta', lo: 0.5, hi: 4 },
    { key: 'theta', lo: 4, hi: 8 },
    { key: 'alpha', lo: 8, hi: 13 },
    { key: 'beta',  lo: 13, hi: 30 },
    { key: 'gamma', lo: 30, hi: 100 }
  ];

    for (let i = 0; i < BANDS.length; i++) if (f >= BANDS[i].lo && f < BANDS[i].hi) return BANDS[i].key;

  }

    rng, gaussNoise, gauss, timeAxis,
    teachingSignal, sleepSignal, spindleSignal, testSignal, mixingSignal,
    amSignal, labSignal, extremaSignal, heroSignal, HERO_PERIOD,
    SLEEP_STAGES, SLEEP_FS, SLEEP_N, BANDS, bandOf

                 'which makes nonlinear interactions between oscillatory components hard to detect — hence HHSA.'
        }
      ],
      paperTable: [
        ['Sleep-EDF', '93.1%', '91.9%'],
        ['DREAMS', '86.4%', '83.4%'],
        ['SHHS', '87.5%', '85.8%']
      ],

      p1Auto: 'Play', p1AutoStop: 'Stop',
      p3Sweep: 'Auto sweep', p3SweepStop: 'Stop',
      verdictNoWhy: 'The h of round %1 is not an IMF yet: %2. It becomes the new signal, and we sift again from step 1.',
      whyC1: 'extrema and zero crossings differ by %1 (needs ≤ 1)',
      whyC2: 'the envelope mean is off by %1% (needs < 5%)',
